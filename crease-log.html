  /* ---- season-cumulative stats (Team tab) — goalie totals fold in BOTH standalone
     Goalie Log sessions and Team Log Against-events for that same goalie profile,
     per docs/team-stats-spec.md decision 3 (one goalie record, either mode). ---- */
  function computeSeasonStats(teamId){
    teamId = teamId || DATA.activeTeamId;
    var players = {};
    function ensureP(id){ return players[id] || (players[id]={goals:0,assists:0,shots:0,hits:0,blocks:0}); }
    var goalies = {};
    function ensureG(id){ return goalies[id] || (goalies[id]={shotsFaced:0,saves:0,ga:0,seconds:0}); }
    DATA.sessions.filter(function(s){ return (s.teamId||DATA.activeTeamId)===teamId; }).forEach(function(s){
      if(s.trackingMode==='team'){
        s.entries.forEach(function(e){
          if(e.type==='goalFor'){ ensureP(e.playerId).goals++; ensureP(e.playerId).shots++; (e.assists||[]).forEach(function(aid){ if(aid) ensureP(aid).assists++; }); }
          else if(e.type==='shotFor'){ ensureP(e.playerId).shots++; }
          else if(e.type==='hit'){ ensureP(e.playerId).hits++; }
          else if(e.type==='blockedShot'){ ensureP(e.playerId).blocks++; }
          else if(e.type==='goalAgainst'){ var g=ensureG(e.goalieId); g.shotsFaced++; g.ga++; }
          else if(e.type==='shotAgainst'){ var g2=ensureG(e.goalieId); g2.shotsFaced++; g2.saves++; }
        });
      } else {
        s.entries.forEach(function(e){
          var g = ensureG(e.goalieId || s.profileId);
          if(e.result==='shot'){ g.shotsFaced++; g.saves++; }
          else if(e.result==='goal'){ g.shotsFaced++; g.ga++; }
        });
      }
      var minutesMap = computeGoalieMinutes(s);
      Object.keys(minutesMap).forEach(function(gid){ ensureG(gid).seconds += minutesMap[gid]; });
    });
    return {players:players, goalies:goalies};
  }

  /* ---- game-roster check (New Session, Team Log only) — Ben's 2026-09-12 ask:
     toggle who's playing this game (default everyone on) + a quick way to fix a
     position while you're already checking names off. Stored as the session's
     activeRosterIds; every roster picker during that session (shot/goal/hit/
     block/assists/goalie-switch) filters down to just this subset. Position
     changes here update the player on the master roster (same as the Team tab),
     they just happen to be handy to do from this checklist too. ---- */
  function openGameRosterStep(onDone){
    var groups = rosterByPosition();
    var active = {};
    rosterList().forEach(function(p){ active[p.id] = true; });
    function row(p){
      var posBadge = (p.position==='G')
        ? '<span class="badge badge-outline">G</span>'
        : '<span class="badge badge-outline pos-toggle-modal" data-id="'+p.id+'" style="cursor:pointer;">'+(p.position==='F'?'F':'D')+'</span>';
      return '<div style="padding:8px 4px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);">'+
        '<label style="display:flex;align-items:center;gap:10px;flex:1;">'+
          '<input type="checkbox" class="roster-active-cb" data-id="'+p.id+'" checked style="width:18px;height:18px;">'+
          '<span><b class="num" style="font-family:\'Oswald\',sans-serif;">#'+esc(p.number||'')+'</b> '+esc(p.name)+'</span>'+
        '</label>'+
        posBadge+
      '</div>';
    }
    function section(label, arr){
      if(!arr.length) return '';
      return '<div style="font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 2px;">'+label+'</div>'+arr.map(row).join('');
    }
    openModal(
      '<div class="modal-title">Roster for this game</div>'+
      '<div class="modal-sub">Uncheck anyone not playing today. Tap F/D to fix a position on the fly.</div>'+
      '<div style="max-height:52vh;overflow-y:auto;">'+
        section('Forwards', groups.F)+section('Defense', groups.D)+section('Goalies', groups.G)+
      '</div>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="grBack">Back</button>'+
        '<button class="btn btn-red" id="grStart">Start Session</button>'+
      '</div>',
      {onMount:function(root){
        root.querySelectorAll('.roster-active-cb').forEach(function(cb){
          cb.addEventListener('change', function(){ active[cb.getAttribute('data-id')] = cb.checked; });
        });
        root.querySelectorAll('.pos-toggle-modal').forEach(function(badge){
          badge.addEventListener('click', function(e){
            e.stopPropagation();
            var p = getRosterPlayer(badge.getAttribute('data-id'));
            if(!p) return;
            p.position = (p.position==='F') ? 'D' : 'F';
            persist();
            badge.textContent = p.position;
          });
        });
        root.querySelector('#grBack').addEventListener('click', closeModal);
        root.querySelector('#grStart').addEventListener('click', function(){
          var ids = Object.keys(active).filter(function(id){ return active[id]; });
          closeModal();
          onDone(ids);
        });
      }}
    );
  }

  /* ---- roster CRUD (Team tab) ---- */
  function openRosterEditModal(existing){
    var editing = !!existing;
    var state = {position: editing?existing.position:'F'};
    var posField = editing
      ? ('<div class="field"><label>Position</label><div style="padding:8px 0;color:var(--ink-soft);font-weight:600;">'+(existing.position==='F'?'Forward':existing.position==='D'?'Defense':'Goalie')+'</div></div>')
      : ('<div class="field"><label>Position</label><div class="seg" id="rpPos">'+
          ['F','D','G'].map(function(p){ return '<button data-v="'+p+'" class="'+(state.position===p?'on':'')+'">'+(p==='F'?'Forward':p==='D'?'Defense':'Goalie')+'</button>'; }).join('')+
        '</div></div>');
    openModal(
      '<div class="modal-title">'+(editing?'Edit Player':'Add Player')+'</div>'+
      '<div class="field"><label>Number</label><input type="text" inputmode="numeric" id="rpNumber" value="'+esc(editing?existing.number:'')+'" placeholder="e.g. 14"></div>'+
      '<div class="field"><label>Name</label><input type="text" id="rpName" value="'+esc(editing?existing.name:'')+'" placeholder="e.g. Jordan Smith"></div>'+
      posField+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="rpCancel">Cancel</button>'+
        (editing?'<button class="btn btn-outline" id="rpDelete">Remove</button>':'')+
        '<button class="btn btn-red" id="rpSave">'+(editing?'Save':'Add')+'</button>'+
      '</div>',
      {center:true, onMount:function(root){
        var posSeg = root.querySelector('#rpPos');
        if(posSeg){
          posSeg.addEventListener('click', function(e){
            var b=e.target.closest('button'); if(!b) return;
            state.position = b.getAttribute('data-v');
            posSeg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on', x===b);});
          });
        }
        root.querySelector('#rpCancel').addEventListener('click', closeModal);
        if(editing){
          root.querySelector('#rpDelete').addEventListener('click', function(){
            closeModal();
            confirmAction('Remove '+existing.name+' from the roster?', function(){
              removeRosterPlayer(existing.id);
              renderTeamScreen();
            });
          });
        }
        root.querySelector('#rpSave').addEventListener('click', function(){
          var num = root.querySelector('#rpNumber').value.trim();
          var name = root.querySelector('#rpName').value.trim();
          if(!name){ showToast('Enter a name.'); return; }
          if(editing){
            existing.number = num; existing.name = name;
            if(existing.position==='G'){
              var prof = DATA.profiles.filter(function(p){return p.id===existing.id;})[0];
              if(prof) prof.name = name;
            }
            persist();
          } else {
            addRosterPlayer(num, name, state.position);
          }
          closeModal();
          renderTeamScreen();
        });
      }}
    );
  }

        '<button class="btn btn-ghost" id="teamNameCancel">Cancel</button>'+

  function renderTeamScreen(){
    var el = document.getElementById('screen-team');
    if(!el) return;
    var teamSwitcherHtml =
      '<div class="panel">'+
        '<div class="field"><label>Active Team</label><select id="teamSwitchSel">'+
          teamList().map(function(t){ return '<option value="'+t.id+'"'+(t.id===DATA.activeTeamId?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('')+
        '</select></div>'+
        '<div style="display:flex;gap:16px;">'+
          '<button class="link-btn" id="newTeamBtn">+ New Team</button>'+
          '<button class="link-btn" id="renameTeamBtn">Rename This Team</button>'+
        '</div>'+
        '<p class="center-note" style="margin-top:6px;">Each team has its own roster and its own goalies — New Session, this roster, and the season stats below all follow whichever team is active here.</p>'+
      '</div>';
    var groups = rosterByPosition();
    function rosterRow(p){
      var badge = (p.position==='G')
        ? '<span class="badge badge-outline">G</span>'
        : '<span class="badge badge-outline pos-toggle" data-id="'+p.id+'" title="Tap to switch F/D" style="cursor:pointer;">'+(p.position==='F'?'F':'D')+'</span>';
      return '<div class="session-card" data-id="'+p.id+'" style="padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;">'+
        '<div><b class="num" style="font-family:\'Oswald\',sans-serif;">#'+esc(p.number||'')+'</b> '+esc(p.name)+'</div>'+
        badge+
      '</div>';
    }
    var rosterHtml =
      '<div class="panel">'+
        '<h3>Forwards</h3>'+(groups.F.length?groups.F.map(rosterRow).join(''):'<p class="center-note">None added.</p>')+
        '<h3 style="margin-top:14px;">Defense</h3>'+(groups.D.length?groups.D.map(rosterRow).join(''):'<p class="center-note">None added.</p>')+
        '<h3 style="margin-top:14px;">Goalies</h3>'+(groups.G.length?groups.G.map(rosterRow).join(''):'<p class="center-note">None added.</p>')+
        '<button class="btn btn-primary btn-full" id="addPlayerBtn" style="margin-top:12px;">＋ Add Player</button>'+
      '</div>';

    var stats = computeSeasonStats();
    var playerRows = rosterList().filter(function(p){return p.position!=='G';}).map(function(p){
      var st = stats.players[p.id] || {goals:0,assists:0,shots:0,hits:0,blocks:0};
      var shPct = st.shots ? Math.round(st.goals/st.shots*1000)/10 : 0;
      return {p:p, st:st, pts: st.goals+st.assists, shPct:shPct};
    }).sort(function(a,b){ return b.pts-a.pts || b.st.goals-a.st.goals; });
    var goalieRows = groups.G.map(function(p){
      var g = stats.goalies[p.id] || {shotsFaced:0,saves:0,ga:0,seconds:0};
      var pct = g.shotsFaced ? Math.round(g.saves/g.shotsFaced*1000)/10 : 0;
      return {p:p, g:g, pct:pct, min:fmtMinutes(g.seconds), gaa:computeGAA(g.ga, g.seconds)};
    });

    var seasonHtml =
      '<div class="panel">'+
        '<h3>Season — Skaters</h3>'+
        (playerRows.length ?
          '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
          '<tr style="color:var(--ink-soft);text-align:left;"><th>#</th><th>Player</th><th>G</th><th>A</th><th>Pts</th><th>Shots</th><th>Sh%</th><th>Hits</th><th>Blk</th></tr>'+
          playerRows.map(function(r){
            return '<tr style="border-top:1px solid var(--line);"><td class="num">'+esc(r.p.number||'')+'</td><td>'+esc(r.p.name)+'</td>'+
              '<td class="num">'+r.st.goals+'</td><td class="num">'+r.st.assists+'</td><td class="num"><b>'+r.pts+'</b></td>'+
              '<td class="num">'+r.st.shots+'</td><td class="num">'+r.shPct+'%</td><td class="num">'+r.st.hits+'</td><td class="num">'+r.st.blocks+'</td></tr>';
          }).join('')+
          '</table></div>'
          : '<p class="center-note">No team games logged yet.</p>')+
        '<h3 style="margin-top:16px;">Season — Goalies</h3>'+
        (goalieRows.length ?
          '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
          '<tr style="color:var(--ink-soft);text-align:left;"><th>Goalie</th><th>SF</th><th>SV</th><th>GA</th><th>SV%</th><th>Min</th><th>GAA</th></tr>'+
          goalieRows.map(function(r){
            return '<tr style="border-top:1px solid var(--line);"><td>'+esc(r.p.name)+'</td><td class="num">'+r.g.shotsFaced+'</td>'+
              '<td class="num">'+r.g.saves+'</td><td class="num">'+r.g.ga+'</td><td class="num"><b>'+r.pct+'%</b></td>'+
              '<td class="num">'+r.min+'</td><td class="num">'+r.gaa+'</td></tr>';
          }).join('')+
          '</table></div>'
          : '<p class="center-note">No goalies on the roster yet.</p>')+
        '<p class="center-note">Goalie totals include both Goalie Log sessions and Team Log games for that goalie. Minutes/GAA assume '+DEFAULT_PERIOD_LENGTH_MIN+'-minute periods (OT counted as one more period-length block) — based on optional switch/clock-time entries, so they’re approximate if those were skipped.</p>'+
      '</div>';

    el.innerHTML = '<div class="section-head"><h2>Team — '+esc(activeTeam().name)+'</h2></div>' + teamSwitcherHtml + rosterHtml + seasonHtml;

    var teamSwitchSel = el.querySelector('#teamSwitchSel');
    if(teamSwitchSel) teamSwitchSel.addEventListener('change', function(){
      switchActiveTeam(this.value);
      renderTeamScreen();
    });
    var newTeamBtn = el.querySelector('#newTeamBtn');
    if(newTeamBtn) newTeamBtn.addEventListener('click', function(){
      openTeamNameModal('New Team', '', function(name){
        var t = addTeam(name);
        switchActiveTeam(t.id);
        renderTeamScreen();
        showToast('Added '+name+'.');
      });
    });
    var renameTeamBtn = el.querySelector('#renameTeamBtn');
    if(renameTeamBtn) renameTeamBtn.addEventListener('click', function(){
      openTeamNameModal('Rename Team', activeTeam().name, function(name){
        renameTeam(DATA.activeTeamId, name);
        renderTeamScreen();
      });
    });
    el.querySelectorAll('.pos-toggle').forEach(function(badge){
      badge.addEventListener('click', function(e){
        e.stopPropagation();
        var p = getRosterPlayer(badge.getAttribute('data-id'));
        if(!p) return;
        p.position = (p.position==='F') ? 'D' : 'F';
        persist();
        renderTeamScreen();
      });
    });
    el.querySelectorAll('.session-card').forEach(function(card){
      card.addEventListener('click', function(){
        var p = getRosterPlayer(card.getAttribute('data-id'));
        if(p) openRosterEditModal(p);
      });
    });
    el.querySelector('#addPlayerBtn').addEventListener('click', function(){ openRosterEditModal(null); });
  }

  /* ---- per-game team box score ---- */
  function renderDetailTeam(s, el){
    var counts = {goalFor:0,goalAgainst:0,shotFor:0,shotAgainst:0,hit:0,blockedShot:0};
    s.entries.forEach(function(e){ if(counts[e.type]!==undefined) counts[e.type]++; });

    var iceForCounts={}, iceForGoals={}, iceForTotal=0;
    var iceAgCounts={}, iceAgGoals={}, iceAgTotal=0;
    var netForCounts={}, netForTotal=0;
    var netAgCounts={}, netAgTotal=0;
    s.entries.forEach(function(e){
      if((e.type==='goalFor'||e.type==='shotFor') && e.ice){
        iceForCounts[e.ice.zone]=(iceForCounts[e.ice.zone]||0)+1; iceForTotal++;
        if(e.type==='goalFor') iceForGoals[e.ice.zone]=(iceForGoals[e.ice.zone]||0)+1;
      }
      if((e.type==='goalAgainst'||e.type==='shotAgainst') && e.ice){
        iceAgCounts[e.ice.zone]=(iceAgCounts[e.ice.zone]||0)+1; iceAgTotal++;
        if(e.type==='goalAgainst') iceAgGoals[e.ice.zone]=(iceAgGoals[e.ice.zone]||0)+1;
      }
      /* Net-zone location is only ever recorded on a goal (Shot For has no net
         step as of round 5 — see handleTeamEvent), so this map only ever shows
         a single goal count per zone, same as the Against net map below. */
      if(e.type==='goalFor' && e.net){ netForCounts[e.net.zone]=(netForCounts[e.net.zone]||0)+1; netForTotal++; }
      if(e.type==='goalAgainst' && e.net){ netAgCounts[e.net.zone]=(netAgCounts[e.net.zone]||0)+1; netAgTotal++; }
    });
    var goalieProfile = DATA.profiles.filter(function(p){return p.id===s.goalieInNetId;})[0];
    var flip = goalieProfile ? goalieProfile.flipSides : false;
    var iceForSVG = iceZonesSVG(null, iceForCounts, iceForGoals);
    var netForSVG = netGoalSVG(null, false, netForCounts);
    var iceAgSVG = iceZonesSVG(null, iceAgCounts, iceAgGoals);
    var netAgSVG = netGoalSVG(null, flip, netAgCounts);

    var pStats = {};
    function ensureP(id){ return pStats[id] || (pStats[id]={goals:0,assists:0,shots:0,hits:0,blocks:0}); }
    s.entries.forEach(function(e){
      /* A goal is itself a shot (the one that scored), so it counts toward
         both goals and shots — standard hockey convention (Shots = Saves +
         Goals). Added 2026-09-12 per Ben's request; Goals still shown as its
         own stat too. */
      if(e.type==='goalFor'){ ensureP(e.playerId).goals++; ensureP(e.playerId).shots++; (e.assists||[]).forEach(function(a){ if(a) ensureP(a).assists++; }); }
      else if(e.type==='shotFor'){ ensureP(e.playerId).shots++; }
      else if(e.type==='hit'){ ensureP(e.playerId).hits++; }
      else if(e.type==='blockedShot'){ ensureP(e.playerId).blocks++; }
    });
    var playerRows = Object.keys(pStats).map(function(id){
      var p = getRosterPlayer(id) || {name:'Unknown', number:''};
      var st = pStats[id];
      var shPct = st.shots ? Math.round(st.goals/st.shots*1000)/10 : 0;
      return {p:p, st:st, pts: st.goals+st.assists, shPct:shPct};
    }).sort(function(a,b){ return b.pts-a.pts || b.st.goals-a.st.goals; });

    var gStats = {};
    function ensureG(id){ return gStats[id] || (gStats[id]={shotsFaced:0,saves:0,ga:0}); }
    s.entries.forEach(function(e){
      if(e.type==='shotAgainst'){ var g=ensureG(e.goalieId); g.shotsFaced++; g.saves++; }
      else if(e.type==='goalAgainst'){ var g2=ensureG(e.goalieId); g2.shotsFaced++; g2.ga++; }
    });
    var gameMinutesMap = computeGoalieMinutes(s);
    var goalieRows = Object.keys(gStats).map(function(id){
      var prof = DATA.profiles.filter(function(p){return p.id===id;})[0] || {name:'Unknown'};
      var g = gStats[id];
      var pct = g.shotsFaced ? Math.round(g.saves/g.shotsFaced*1000)/10 : 0;
      var sec = gameMinutesMap[id]||0;
      return {name:prof.name, g:g, pct:pct, min:fmtMinutes(sec), gaa:computeGAA(g.ga, sec)};
    });

    var playerTableHtml = playerRows.length ?
      ('<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
      '<tr style="color:var(--ink-soft);text-align:left;"><th>#</th><th>Player</th><th>G</th><th>A</th><th>Pts</th><th>Shots</th><th>Sh%</th><th>Hits</th><th>Blk</th></tr>'+
      playerRows.map(function(r){
        return '<tr style="border-top:1px solid var(--line);"><td class="num">'+esc(r.p.number||'')+'</td><td>'+esc(r.p.name)+'</td>'+
          '<td class="num">'+r.st.goals+'</td><td class="num">'+r.st.assists+'</td><td class="num"><b>'+r.pts+'</b></td>'+
          '<td class="num">'+r.st.shots+'</td><td class="num">'+r.shPct+'%</td><td class="num">'+r.st.hits+'</td><td class="num">'+r.st.blocks+'</td></tr>';
      }).join('')+'</table></div>')
      : '<p class="center-note">No player-attributed events logged.</p>';

    var goalieTableHtml = goalieRows.length ?
      ('<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
      '<tr style="color:var(--ink-soft);text-align:left;"><th>Goalie</th><th>SF</th><th>SV</th><th>GA</th><th>SV%</th><th>Min</th><th>GAA</th></tr>'+
      goalieRows.map(function(r){
        return '<tr style="border-top:1px solid var(--line);"><td>'+esc(r.name)+'</td><td class="num">'+r.g.shotsFaced+'</td>'+
          '<td class="num">'+r.g.saves+'</td><td class="num">'+r.g.ga+'</td><td class="num"><b>'+r.pct+'%</b></td>'+
          '<td class="num">'+r.min+'</td><td class="num">'+r.gaa+'</td></tr>';
      }).join('')+'</table></div>')
      : '<p class="center-note">No shots against logged.</p>';

    var entriesHtml = s.entries.slice().reverse().map(function(en,i){
      var idx = s.entries.length - i;
      var bits = [];
      bits.push(en.period==='OT'?'OT':('P'+(en.period||1)));
      if(en.clock) bits.push('⏱ '+en.clock);
      if(en.playerId){ var p = getRosterPlayer(en.playerId); if(p) bits.push('#'+(p.number||'')+' '+p.name+(en.position?(' ('+en.position+')'):'')); }
      if(en.goalieId){ var g = DATA.profiles.filter(function(x){return x.id===en.goalieId;})[0]; if(g) bits.push('G: '+g.name); }
      if(en.ice) bits.push(iceZoneLabel(en.ice.zone));
      if(en.net) bits.push(en.type==='goalFor' ? netZoneLabel(en.net.zone, false) : netZoneLabel(en.net.zone, flip));
      if(en.assists && (en.assists[0]||en.assists[1])){
        var names = en.assists.filter(Boolean).map(function(id){ var pp=getRosterPlayer(id); return pp?pp.name:''; }).filter(Boolean);
        if(names.length) bits.push('Ast: '+names.join(', '));
      }
      var resultClass = (en.type==='goalFor'||en.type==='goalAgainst') ? 'goal' : 'shot';
      var typeLabels = {goalFor:'Goal For',goalAgainst:'Goal Against',shotFor:'Shot For',shotAgainst:'Shot Against',hit:'Hit',blockedShot:'Blocked Shot'};
      return (
        '<div class="log-row" data-id="'+en.id+'">'+
          '<div class="lr-left"><span class="lr-chip '+resultClass+'"></span>'+
          '<div><div>#'+idx+' · '+esc(typeLabels[en.type]||en.type)+'</div>'+
          (bits.length?('<div class="lr-detail">'+esc(bits.join(' · '))+'</div>'):'')+
          '</div></div>'+
        '</div>'
      );
    }).join('');

    el.innerHTML =
      '<div class="section-head"><h2>'+fmtDate(s.date)+'</h2>'+
        '<span>'+(s.finishedAt ? '<button class="link-btn" id="resumeBtn" style="margin-right:12px;">Resume ▸</button>' : '')+
        '<button class="link-btn" id="btnEditSessionInfo">Edit Info</button></span>'+
      '</div>'+
      '<div class="stat-tiles">'+
        '<div class="big-tile"><div class="v red">'+counts.goalFor+'-'+counts.goalAgainst+'</div><div class="l">Goals F-A</div></div>'+
        '<div class="big-tile"><div class="v">'+(counts.shotFor+counts.goalFor)+'-'+(counts.shotAgainst+counts.goalAgainst)+'</div><div class="l">Shots F-A</div></div>'+
        '<div class="big-tile"><div class="v blue">'+counts.hit+'</div><div class="l">Hits</div></div>'+
      '</div>'+
      (iceForTotal ? ('<div class="panel"><h3>Goal / Shot Ice Zone Location — Ours (For)</h3>'+iceForSVG+'</div>') : '')+
      (netForTotal ? ('<div class="panel"><h3>Goal Net Zone Location — Ours (For)</h3>'+netForSVG+'</div>') : '')+
      (iceAgTotal ? ('<div class="panel"><h3>Goal / Shot Ice Zone Location — Against</h3>'+iceAgSVG+'</div>') : '')+
      (netAgTotal ? ('<div class="panel"><h3>Goal Net Zone Location — Against</h3>'+netAgSVG+'</div>') : '')+
      '<div class="panel"><h3>Skaters</h3>'+playerTableHtml+'</div>'+
      '<div class="panel"><h3>Goalie</h3>'+goalieTableHtml+'</div>'+
      '<div class="panel"><h3>All Entries</h3><div class="log-list">'+(entriesHtml || '<div class="center-note">No entries logged.</div>')+'</div></div>'+
      '<button class="btn btn-outline btn-full" id="deleteSessionBtn" style="margin-top:4px;">Delete Session</button>';

    var resumeBtn = el.querySelector('#resumeBtn');
    if(resumeBtn) resumeBtn.addEventListener('click', function(){
      s.finishedAt = null;
      DATA.activeSessionId = s.id;
      persist();
      showScreen('track');
    });
    el.querySelector('#btnEditSessionInfo').addEventListener('click', function(){ openEditSessionModal(s, function(){ renderDetail(); }); });
    el.querySelector('#deleteSessionBtn').addEventListener('click', function(){
      confirmAction('Delete this entire session? This cannot be undone.', function(){
        DATA.sessions = DATA.sessions.filter(function(x){return x.id!==s.id;});
        persist();
        showScreen('home');
      });
    });
  }

  /* ================= SESSION DETAIL ================= */
  function openSessionDetail(id){
    DATA.viewingSessionId = id;
    showScreen('detail');
  }

  function renderDetail(){
    var el = document.getElementById('screen-detail');
    var s = getSession(DATA.viewingSessionId);
    if(!s){ el.innerHTML = '<div class="empty-state">Session not found.</div>'; return; }
    if(s.trackingMode==='team'){ renderDetailTeam(s, el); return; }
    var flip = goalieFlipFor(s.goalieInNetId||s.profileId);
    var multiGoalie = sessionHasMultipleGoalies(s);
    var shots = s.entries.filter(function(e){return e.result==='shot';}).length;
    var goals = s.entries.filter(function(e){return e.result==='goal';}).length;
    var total = shots+goals;
    var pct = total ? Math.round(shots/total*1000)/10 : 0;

    var iceCounts = {};
    var iceGoalCounts = {};
    var iceTotal = 0;
    s.entries.forEach(function(e){
      if(e.ice && e.ice.zone){
        iceCounts[e.ice.zone] = (iceCounts[e.ice.zone]||0)+1;
        iceTotal++;
        if(e.result==='goal'){
          iceGoalCounts[e.ice.zone] = (iceGoalCounts[e.ice.zone]||0)+1;
        }
      }
    });
    var iceSVG = iceZonesSVG(null, iceCounts, iceGoalCounts);

    var netCounts = {};
    var netTotal = 0;
    s.entries.forEach(function(e){
      if(e.result==='goal' && e.net){
        var k = e.net.zone;
        netCounts[k] = (netCounts[k]||0)+1;
        netTotal++;
      }
    });
    var netSVG = netGoalSVG(null, flip, netCounts);

    function breakdown(field, labelFn){
      var counts = {};
      s.entries.forEach(function(e){
        if(e.result==='goal' && e[field]!==undefined && e[field]!==null && e[field]!==''){
          var k = labelFn ? labelFn(e[field]) : e[field];
          counts[k] = (counts[k]||0)+1;
        }
      });
      var keys = Object.keys(counts);
      if(!keys.length) return '';
      return keys.sort(function(a,b){return counts[b]-counts[a];}).map(function(k){
        return '<div class="breakdown-row"><span class="k">'+esc(k)+'</span><span class="v">'+counts[k]+'</span></div>';
      }).join('');
    }
    var typeBd = breakdown('shotType');
    var reboundBd = breakdown('rebound', function(v){ return v ? 'Off a rebound' : 'First shot'; });
    var sitBd = breakdown('situation');

    var entriesHtml = s.entries.slice().reverse().map(function(en,i){
      var idx = s.entries.length - i;
      var bits = [];
      if(en.period) bits.push(en.period==='OT'?'OT':('P'+en.period));
      if(en.clock) bits.push('⏱ '+en.clock);
      if(multiGoalie && en.goalieId){ var eg=DATA.profiles.filter(function(x){return x.id===en.goalieId;})[0]; if(eg) bits.push('G: '+eg.name); }
      if(en.ice) bits.push(iceZoneLabel(en.ice.zone));
      if(en.shotType) bits.push(en.shotType);
      if(en.rebound) bits.push('Rebound');
      if(en.situation) bits.push(en.situation);
      if(en.net) bits.push(netZoneLabel(en.net.zone, goalieFlipFor(en.goalieId)));
      return (
        '<div class="log-row" data-id="'+en.id+'">'+
          '<div class="lr-left"><span class="lr-chip '+en.result+'"></span>'+
          '<div><div>#'+idx+' · '+(en.result==='goal'?'Goal':'Shot')+'</div>'+
          (bits.length?('<div class="lr-detail">'+esc(bits.join(' · '))+'</div>'):'')+
          '</div></div>'+
          '<button class="lr-del" data-id="'+en.id+'">✕</button>'+
        '</div>'
      );
    }).join('');

    var goalieSplitsHtml = '';
    if(multiGoalie){
      var gStats2 = {};
      var ensureGS = function(id){ return gStats2[id] || (gStats2[id]={shotsFaced:0,saves:0,ga:0}); };
      s.entries.forEach(function(e){
        var gid = e.goalieId || s.profileId;
        var g = ensureGS(gid);
        if(e.result==='shot'){ g.shotsFaced++; g.saves++; }
        else if(e.result==='goal'){ g.shotsFaced++; g.ga++; }
      });
      var minutesMap2 = computeGoalieMinutes(s);
      var rows2 = Object.keys(gStats2).map(function(id){
        var prof = DATA.profiles.filter(function(p){return p.id===id;})[0] || {name:'Unknown'};
        var g = gStats2[id];
        var pct2 = g.shotsFaced ? Math.round(g.saves/g.shotsFaced*1000)/10 : 0;
        var sec = minutesMap2[id]||0;
        return '<tr style="border-top:1px solid var(--line);"><td>'+esc(prof.name)+'</td><td class="num">'+g.shotsFaced+'</td>'+
          '<td class="num">'+g.saves+'</td><td class="num">'+g.ga+'</td><td class="num"><b>'+pct2+'%</b></td>'+
          '<td class="num">'+fmtMinutes(sec)+'</td><td class="num">'+computeGAA(g.ga,sec)+'</td></tr>';
      }).join('');
      goalieSplitsHtml = '<div class="panel"><h3>Goalie Splits</h3><div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
        '<tr style="color:var(--ink-soft);text-align:left;"><th>Goalie</th><th>SF</th><th>SV</th><th>GA</th><th>SV%</th><th>Min</th><th>GAA</th></tr>'+
        rows2+'</table></div></div>';
    }

    el.innerHTML =
      '<div class="section-head"><h2>'+fmtDate(s.date)+'</h2>'+
        '<span>'+(s.finishedAt ? '<button class="link-btn" id="resumeBtn" style="margin-right:12px;">Resume ▸</button>' : '')+
        '<button class="link-btn" id="btnEditSessionInfo">Edit Info</button></span>'+
      '</div>'+
      '<div class="stat-tiles">'+
        '<div class="big-tile"><div class="v">'+total+'</div><div class="l">Shots Faced</div></div>'+
        '<div class="big-tile"><div class="v red">'+goals+'</div><div class="l">Goals</div></div>'+
        '<div class="big-tile"><div class="v blue">'+pct+'%</div><div class="l">Save %</div></div>'+
      '</div>'+
      goalieSplitsHtml+
      (iceTotal ? (
        '<div class="panel"><h3>Shot Location — Ice Zones</h3>'+iceSVG+'</div>'
      ) : '')+
      (netTotal ? '<div class="panel"><h3>Goal Location — Net Zones</h3>'+netSVG+'</div>' : '')+
      (typeBd || reboundBd || sitBd ? (
        '<div class="panel"><h3>Goal Breakdown</h3>'+
        (typeBd ? ('<div style="font-size:11px;color:var(--ink-soft);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.05em;">Shot Type</div>'+typeBd) : '')+
        (reboundBd ? ('<div style="font-size:11px;color:var(--ink-soft);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;">Rebound</div>'+reboundBd) : '')+
        (sitBd ? ('<div style="font-size:11px;color:var(--ink-soft);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;">Situation</div>'+sitBd) : '')+
        '</div>'
      ) : '')+
      '<div class="panel"><h3>All Entries</h3><div class="log-list">'+(entriesHtml || '<div class="center-note">No entries logged.</div>')+'</div></div>'+
      '<button class="btn btn-outline btn-full" id="deleteSessionBtn" style="margin-top:4px;">Delete Session</button>';

    var resumeBtn = el.querySelector('#resumeBtn');
    if(resumeBtn) resumeBtn.addEventListener('click', function(){
      s.finishedAt = null;
      DATA.activeSessionId = s.id;
      persist();
      showScreen('track');
    });
    el.querySelector('#btnEditSessionInfo').addEventListener('click', function(){ openEditSessionModal(s, function(){ renderDetail(); }); });
    el.querySelectorAll('.lr-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        confirmAction('Delete this entry?', function(){
          s.entries = s.entries.filter(function(x){return x.id!==id;});
          persist();
          renderDetail();
        });
      });
    });
    el.querySelector('#deleteSessionBtn').addEventListener('click', function(){
      confirmAction('Delete this entire session? This cannot be undone.', function(){
        DATA.sessions = DATA.sessions.filter(function(x){return x.id!==s.id;});
        persist();
        showScreen('home');
      });
    });
  }

  /* ================= EXPORT ================= */
  /* ================= Stats tab (new, 2026-09-12) =================
     A filterable cross-session stats view. Narrow by opponent / session
     type / home-away, pick specific games from what's left (multi-select,
     defaults to everything eligible), then choose "who": the whole team,
     a position group, one specific player, one specific goalie, or all
     goalies combined. That slice's aggregated ice-zone map, net-zone map,
     and overall totals render below, plus an "export summary" CSV button.

     Deliberately no log-type (Goalie Log vs Team Log) filter — per Ben's
     explicit instruction, a goalie's stats always accumulate across both
     log types (same as the season leaderboard on the Team tab already
     does), so splitting by log type would fight that. */
  var STATS_FILTER = {teamId:null, opponent:'all', sessionType:'all', homeAway:'all', who:'team:all', sessionIds:null};

  function statsDistinctOpponents(teamId){
    var set = {};
    DATA.sessions.forEach(function(s){ if((s.teamId||DATA.activeTeamId)===teamId && s.opponent && s.opponent.trim()) set[s.opponent.trim()]=true; });
    return Object.keys(set).sort();
  }
  function statsEligibleSessions(){
    return DATA.sessions.filter(function(s){
      if((s.teamId||DATA.activeTeamId)!==STATS_FILTER.teamId) return false;
      if(STATS_FILTER.opponent!=='all' && (s.opponent||'').trim()!==STATS_FILTER.opponent) return false;
      if(STATS_FILTER.sessionType!=='all' && s.type!==STATS_FILTER.sessionType) return false;
      if(STATS_FILTER.homeAway!=='all'){
        if(s.trackingMode!=='team' || s.homeAway!==STATS_FILTER.homeAway) return false;
      }
      return true;
    }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0); });
  }
  function statsSelectedSessions(){
    var elig = statsEligibleSessions();
    if(!STATS_FILTER.sessionIds) return elig;
    return elig.filter(function(s){ return STATS_FILTER.sessionIds[s.id]!==false; });
  }
  function statsWhoOptions(teamId){
    var groups = rosterByPositionForTeam(teamId);
    var opts = '<optgroup label="Team">'+
      '<option value="team:all"'+(STATS_FILTER.who==='team:all'?' selected':'')+'>Whole Team — All Skaters</option>'+
      '<option value="team:F"'+(STATS_FILTER.who==='team:F'?' selected':'')+'>Forwards (combined)</option>'+
      '<option value="team:D"'+(STATS_FILTER.who==='team:D'?' selected':'')+'>Defense (combined)</option>'+
    '</optgroup>';
    var skaters = groups.F.concat(groups.D);
    if(skaters.length){
      opts += '<optgroup label="Player">'+skaters.map(function(p){
        var v = 'player:'+p.id;
        return '<option value="'+v+'"'+(STATS_FILTER.who===v?' selected':'')+'>#'+esc(p.number||'')+' '+esc(p.name)+'</option>';
      }).join('')+'</optgroup>';
    }
    var seen = {}, goalieList = [];
    rosterListForTeam(teamId).forEach(function(p){ if(p.position==='G' && !seen[p.id]){ seen[p.id]=true; goalieList.push({id:p.id, label:'#'+(p.number||'')+' '+p.name}); } });
    DATA.profiles.filter(function(pr){return pr.teamId===teamId;}).forEach(function(pr){ if(!seen[pr.id]){ seen[pr.id]=true; goalieList.push({id:pr.id, label:pr.name}); } });
    if(goalieList.length){
      opts += '<optgroup label="Goalie">'+
        '<option value="goalie:all"'+(STATS_FILTER.who==='goalie:all'?' selected':'')+'>All Goalies (combined)</option>'+
        goalieList.map(function(g){
          var v = 'goalie:'+g.id;
          return '<option value="'+v+'"'+(STATS_FILTER.who===v?' selected':'')+'>'+esc(g.label)+'</option>';
        }).join('')+
      '</optgroup>';
    }
    return opts;
  }

  function statsPlayerMatches(player, kind, arg){
    if(!player) return false;
    if(kind==='player') return player.id===arg;
    if(kind==='team'){
      if(arg==='all') return player.position!=='G';
      return player.position===arg;
    }
    return false;
  }

  function computeStatsSkaterView(sessions, kind, arg){
    var pStats = {};
    function ensureP(id){ return pStats[id] || (pStats[id]={goals:0,assists:0,shots:0,hits:0,blocks:0}); }
    var iceCounts={}, iceGoals={}, iceTotal=0;
    var netCounts={}, netTotal=0;
    var gamesCounted = 0;
    sessions.forEach(function(s){
      if(s.trackingMode!=='team') return;
      var touched = false;
      s.entries.forEach(function(e){
        if(e.type==='goalFor'){
          var scorer = getRosterPlayer(e.playerId);
          if(statsPlayerMatches(scorer, kind, arg)){
            /* A goal also counts as a shot (see the matching change in
               renderDetailTeam/computeSeasonStats) — 2026-09-12. */
            ensureP(e.playerId).goals++; ensureP(e.playerId).shots++; touched = true;
            if(e.ice){ iceCounts[e.ice.zone]=(iceCounts[e.ice.zone]||0)+1; iceGoals[e.ice.zone]=(iceGoals[e.ice.zone]||0)+1; iceTotal++; }
            if(e.net){ netCounts[e.net.zone]=(netCounts[e.net.zone]||0)+1; netTotal++; }
          }
          (e.assists||[]).forEach(function(aid){
            if(!aid) return;
            var ap = getRosterPlayer(aid);
            if(statsPlayerMatches(ap, kind, arg)){ ensureP(aid).assists++; touched = true; }
          });
        } else if(e.type==='shotFor'){
          var shooter = getRosterPlayer(e.playerId);
          if(statsPlayerMatches(shooter, kind, arg)){
            ensureP(e.playerId).shots++; touched = true;
            if(e.ice){ iceCounts[e.ice.zone]=(iceCounts[e.ice.zone]||0)+1; iceTotal++; }
          }
        } else if(e.type==='hit'){
          var hitter = getRosterPlayer(e.playerId);
          if(statsPlayerMatches(hitter, kind, arg)){ ensureP(e.playerId).hits++; touched = true; }
        } else if(e.type==='blockedShot'){
          var blocker = getRosterPlayer(e.playerId);
          if(statsPlayerMatches(blocker, kind, arg)){ ensureP(e.playerId).blocks++; touched = true; }
        }
      });
      if(touched) gamesCounted++;
    });
    var rows = Object.keys(pStats).map(function(id){
      var p = getRosterPlayer(id) || {name:'Unknown', number:''};
      var st = pStats[id];
      var shPct = st.shots ? Math.round(st.goals/st.shots*1000)/10 : 0;
      return {p:p, st:st, pts: st.goals+st.assists, shPct:shPct};
    }).sort(function(a,b){ return b.pts-a.pts || b.st.goals-a.st.goals; });
    var totals = rows.reduce(function(acc,r){
      acc.goals+=r.st.goals; acc.assists+=r.st.assists; acc.shots+=r.st.shots; acc.hits+=r.st.hits; acc.blocks+=r.st.blocks;
      return acc;
    }, {goals:0,assists:0,shots:0,hits:0,blocks:0});
    var totalShPct = totals.shots ? Math.round(totals.goals/totals.shots*1000)/10 : 0;
    return {
      mode:'skater', kind:kind, arg:arg, gamesCounted:gamesCounted, sessionsTotal:sessions.length,
      rows:rows, totals:totals, totalShPct:totalShPct,
      iceSVG: iceTotal ? iceZonesSVG(null, iceCounts, iceGoals) : '', iceTotal:iceTotal, iceCounts:iceCounts, iceGoals:iceGoals,
      netSVG: netTotal ? netGoalSVG(null, false, netCounts) : '', netTotal:netTotal, netCounts:netCounts
    };
  }

  function computeStatsGoalieView(sessions, arg){
    var gStats = {};
    function ensureG(id){ return gStats[id] || (gStats[id]={shotsFaced:0,saves:0,ga:0,seconds:0}); }
    var iceCounts={}, iceTotal=0;
    var netCounts={}, netTotal=0;
    var gamesCounted = 0;
    function matches(id){ return arg==='all' ? true : id===arg; }
    sessions.forEach(function(s){
      var touched = false;
      if(s.trackingMode==='team'){
        s.entries.forEach(function(e){
          if(e.type==='shotAgainst' && matches(e.goalieId)){
            ensureG(e.goalieId).shotsFaced++; ensureG(e.goalieId).saves++; touched = true;
            if(e.ice){ iceCounts[e.ice.zone]=(iceCounts[e.ice.zone]||0)+1; iceTotal++; }
          } else if(e.type==='goalAgainst' && matches(e.goalieId)){
            ensureG(e.goalieId).shotsFaced++; ensureG(e.goalieId).ga++; touched = true;
            if(e.ice){ iceCounts[e.ice.zone]=(iceCounts[e.ice.zone]||0)+1; iceTotal++; }
            if(e.net){ netCounts[e.net.zone]=(netCounts[e.net.zone]||0)+1; netTotal++; }
          }
        });
      } else {
        var gid0 = s.profileId;
        s.entries.forEach(function(e){
          var gid = e.goalieId || gid0;
          if(!matches(gid)) return;
          if(e.result==='shot'){
            ensureG(gid).shotsFaced++; ensureG(gid).saves++; touched = true;
            if(e.ice){ iceCounts[e.ice.zone]=(iceCounts[e.ice.zone]||0)+1; iceTotal++; }
          } else if(e.result==='goal'){
            ensureG(gid).shotsFaced++; ensureG(gid).ga++; touched = true;
            if(e.ice){ iceCounts[e.ice.zone]=(iceCounts[e.ice.zone]||0)+1; iceTotal++; }
            if(e.net){ netCounts[e.net.zone]=(netCounts[e.net.zone]||0)+1; netTotal++; }
          }
        });
      }
      if(touched){
        gamesCounted++;
        var minutesMap = computeGoalieMinutes(s);
        Object.keys(minutesMap).forEach(function(gid){ if(matches(gid)) ensureG(gid).seconds += minutesMap[gid]; });
      }
    });
    var rows = Object.keys(gStats).map(function(id){
      var prof = DATA.profiles.filter(function(p){return p.id===id;})[0];
      var rosterP = getRosterPlayer(id);
      var name = prof ? prof.name : (rosterP ? rosterP.name : 'Unknown');
      var g = gStats[id];
      var pct = g.shotsFaced ? Math.round(g.saves/g.shotsFaced*1000)/10 : 0;
      return {id:id, name:name, g:g, pct:pct, gaa:computeGAA(g.ga, g.seconds), minLabel:fmtMinutes(g.seconds)};
    }).sort(function(a,b){ return b.g.shotsFaced-a.g.shotsFaced; });
    var totals = rows.reduce(function(acc,r){
      acc.shotsFaced+=r.g.shotsFaced; acc.saves+=r.g.saves; acc.ga+=r.g.ga; acc.seconds+=r.g.seconds;
      return acc;
    }, {shotsFaced:0,saves:0,ga:0,seconds:0});
    var totalPct = totals.shotsFaced ? Math.round(totals.saves/totals.shotsFaced*1000)/10 : 0;
    /* A single goalie's own handedness drives the net-map flip. Combining
       multiple goalies (arg==='all') has no one consistent handedness to
       show, so the map stays unflipped (plain physical Left/Right) — same
       reasoning as the "For" net map, which never had a tracked handedness. */
    var flip = false;
    if(arg!=='all'){
      var prof2 = DATA.profiles.filter(function(p){return p.id===arg;})[0];
      flip = prof2 ? prof2.flipSides : false;
    }
    return {
      mode:'goalie', arg:arg, gamesCounted:gamesCounted, sessionsTotal:sessions.length,
      rows:rows, totals:totals, totalPct:totalPct, totalGAA:computeGAA(totals.ga, totals.seconds), totalMin:fmtMinutes(totals.seconds),
      iceSVG: iceTotal ? iceZonesSVG(null, iceCounts) : '', iceTotal:iceTotal, iceCounts:iceCounts,
      netSVG: netTotal ? netGoalSVG(null, flip, netCounts) : '', netTotal:netTotal, netCounts:netCounts
    };
  }

  function computeStatsView(){
    var sessions = statsSelectedSessions();
    var parts = STATS_FILTER.who.split(':');
    var kind = parts[0];
    var arg = parts.slice(1).join(':');
    if(kind==='goalie') return computeStatsGoalieView(sessions, arg);
    return computeStatsSkaterView(sessions, kind, arg);
  }

  function statsWhoLabel(view){
    if(view.mode==='goalie'){
      if(view.arg==='all') return 'All Goalies (combined)';
      var prof = DATA.profiles.filter(function(p){return p.id===view.arg;})[0];
      return prof ? prof.name : 'Goalie';
    }
    if(view.kind==='player'){ var p = getRosterPlayer(view.arg); return p ? ('#'+(p.number||'')+' '+p.name) : 'Player'; }
    if(view.kind==='team' && view.arg==='F') return 'Forwards';
    if(view.kind==='team' && view.arg==='D') return 'Defense';
    return 'Whole Team';
  }

  function renderStatsResultsHtml(view){
    var whoLabel = statsWhoLabel(view);
    var noData = !view.iceTotal && !view.netTotal && !view.rows.length;
    if(view.mode==='skater'){
      var tableHtml = view.rows.length ?
        ('<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
        '<tr style="color:var(--ink-soft);text-align:left;"><th>#</th><th>Player</th><th>G</th><th>A</th><th>Pts</th><th>Shots</th><th>Sh%</th><th>Hits</th><th>Blk</th></tr>'+
        view.rows.map(function(r){
          return '<tr style="border-top:1px solid var(--line);"><td class="num">'+esc(r.p.number||'')+'</td><td>'+esc(r.p.name)+'</td>'+
            '<td class="num">'+r.st.goals+'</td><td class="num">'+r.st.assists+'</td><td class="num"><b>'+r.pts+'</b></td>'+
            '<td class="num">'+r.st.shots+'</td><td class="num">'+r.shPct+'%</td><td class="num">'+r.st.hits+'</td><td class="num">'+r.st.blocks+'</td></tr>';
        }).join('')+'</table></div>') : '';
      return (
        '<div class="panel">'+
          '<div class="section-head" style="margin-bottom:6px;"><h2 style="font-size:13px;">'+esc(whoLabel)+'</h2></div>'+
          '<p class="center-note" style="margin:0 0 10px;">'+view.gamesCounted+' of '+view.sessionsTotal+' selected games had matching activity</p>'+
          '<div class="stat-tiles">'+
            '<div class="big-tile"><div class="v red">'+view.totals.goals+'</div><div class="l">Goals</div></div>'+
            '<div class="big-tile"><div class="v">'+view.totals.assists+'</div><div class="l">Assists</div></div>'+
            '<div class="big-tile"><div class="v blue">'+(view.totals.goals+view.totals.assists)+'</div><div class="l">Points</div></div>'+
          '</div>'+
          '<div class="stat-tiles">'+
            '<div class="big-tile"><div class="v">'+view.totals.shots+'</div><div class="l">Shots</div></div>'+
            '<div class="big-tile"><div class="v">'+view.totals.hits+'</div><div class="l">Hits</div></div>'+
            '<div class="big-tile"><div class="v">'+view.totals.blocks+'</div><div class="l">Blocked</div></div>'+
          '</div>'+
          '<div class="stat-tiles">'+
            '<div class="big-tile"><div class="v blue">'+view.totalShPct+'%</div><div class="l">Shooting %</div></div>'+
          '</div>'+
        '</div>'+
        (view.iceTotal ? ('<div class="panel"><h3>Goal / Shot Ice Zone Location</h3>'+view.iceSVG+'</div>') : '')+
        (view.netTotal ? ('<div class="panel"><h3>Goal Net Zone Location</h3>'+view.netSVG+'</div>') : '')+
        (view.rows.length>1 ? ('<div class="panel"><h3>Per-Player Breakdown</h3>'+tableHtml+'</div>') : '')+
        (noData ? '<div class="panel"><p class="center-note">No entries match this selection.</p></div>' : '')
      );
    }
    var goalieTableHtml = view.rows.length>1 ?
      ('<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:12.5px;">'+
      '<tr style="color:var(--ink-soft);text-align:left;"><th>Goalie</th><th>SF</th><th>SV</th><th>GA</th><th>SV%</th><th>Min</th><th>GAA</th></tr>'+
      view.rows.map(function(r){
        return '<tr style="border-top:1px solid var(--line);"><td>'+esc(r.name)+'</td><td class="num">'+r.g.shotsFaced+'</td>'+
          '<td class="num">'+r.g.saves+'</td><td class="num">'+r.g.ga+'</td><td class="num"><b>'+r.pct+'%</b></td>'+
          '<td class="num">'+r.minLabel+'</td><td class="num">'+r.gaa+'</td></tr>';
      }).join('')+'</table></div>') : '';
    return (
      '<div class="panel">'+
        '<div class="section-head" style="margin-bottom:6px;"><h2 style="font-size:13px;">'+esc(whoLabel)+'</h2></div>'+
        '<p class="center-note" style="margin:0 0 10px;">'+view.gamesCounted+' of '+view.sessionsTotal+' selected games had matching activity</p>'+
        '<div class="stat-tiles">'+
          '<div class="big-tile"><div class="v">'+view.totals.shotsFaced+'</div><div class="l">Shots Faced</div></div>'+
          '<div class="big-tile"><div class="v blue">'+view.totals.saves+'</div><div class="l">Saves</div></div>'+
          '<div class="big-tile"><div class="v red">'+view.totals.ga+'</div><div class="l">Goals Against</div></div>'+
        '</div>'+
        '<div class="stat-tiles">'+
          '<div class="big-tile"><div class="v">'+view.totalPct+'%</div><div class="l">Save %</div></div>'+
          '<div class="big-tile"><div class="v">'+view.totalMin+'</div><div class="l">Minutes</div></div>'+
          '<div class="big-tile"><div class="v">'+view.totalGAA+'</div><div class="l">GAA</div></div>'+
        '</div>'+
      '</div>'+
      (view.iceTotal ? ('<div class="panel"><h3>Goal / Shot Ice Zone Location — Against</h3>'+view.iceSVG+'</div>') : '')+
      (view.netTotal ? ('<div class="panel"><h3>Goal Net Zone Location — Against</h3>'+view.netSVG+'</div>') : '')+
      (goalieTableHtml ? ('<div class="panel"><h3>Per-Goalie Breakdown</h3>'+goalieTableHtml+'</div>') : '')+
      (noData ? '<div class="panel"><p class="center-note">No entries match this selection.</p></div>' : '')
    );
  }

  function buildStatsSummaryCSV(view){
    var rows = [];
    rows.push(['Crease Log — Stats Summary Export']);
    rows.push(['Generated', new Date().toISOString()]);
    rows.push(['Team', (getTeam(STATS_FILTER.teamId)||{name:''}).name]);
    rows.push(['Opponent filter', STATS_FILTER.opponent]);
    rows.push(['Session type filter', STATS_FILTER.sessionType]);
    rows.push(['Home/Away filter', STATS_FILTER.homeAway]);
    rows.push(['Who', statsWhoLabel(view)]);
    rows.push(['Games included', view.gamesCounted+' of '+view.sessionsTotal+' selected']);
    rows.push([]);
    if(view.mode==='skater'){
      rows.push(['Overall Totals']);
      rows.push(['Goals','Assists','Points','Shots','Sh%','Hits','Blocked']);
      rows.push([view.totals.goals, view.totals.assists, view.totals.goals+view.totals.assists, view.totals.shots, view.totalShPct+'%', view.totals.hits, view.totals.blocks]);
      rows.push([]);
      if(view.rows.length>1){
        rows.push(['Per-Player Breakdown']);
        rows.push(['Number','Name','Goals','Assists','Points','Shots','Sh%','Hits','Blocked']);
        view.rows.forEach(function(r){ rows.push([r.p.number||'', r.p.name, r.st.goals, r.st.assists, r.pts, r.st.shots, r.shPct+'%', r.st.hits, r.st.blocks]); });
        rows.push([]);
      }
      rows.push(['Ice Zone (Goal/Shot Location)']);
      rows.push(['Zone','Shots','Goals']);
      ICE_ZONES.forEach(function(z){ if(view.iceCounts[z.key]) rows.push([iceZoneLabel(z.key), view.iceCounts[z.key], view.iceGoals[z.key]||0]); });
      rows.push([]);
      rows.push(['Net Zone (Goal Location)']);
      rows.push(['Zone','Goals']);
      NET_ZONE_ORDER.forEach(function(key){ if(view.netCounts[key]) rows.push([netZoneLabel(key,false), view.netCounts[key]]); });
    } else {
      rows.push(['Overall Totals']);
      rows.push(['Shots Faced','Saves','Goals Against','Save %','Minutes','GAA']);
      rows.push([view.totals.shotsFaced, view.totals.saves, view.totals.ga, view.totalPct+'%', view.totalMin, view.totalGAA]);
      rows.push([]);
      if(view.rows.length>1){
        rows.push(['Per-Goalie Breakdown']);
        rows.push(['Goalie','Shots Faced','Saves','Goals Against','Save %','Minutes','GAA']);
        view.rows.forEach(function(r){ rows.push([r.name, r.g.shotsFaced, r.g.saves, r.g.ga, r.pct+'%', r.minLabel, r.gaa]); });
        rows.push([]);
      }
      rows.push(['Ice Zone (Shots Faced Location)']);
      rows.push(['Zone','Count']);
      ICE_ZONES.forEach(function(z){ if(view.iceCounts[z.key]) rows.push([iceZoneLabel(z.key), view.iceCounts[z.key]]); });
      rows.push([]);
      rows.push(['Net Zone (Goals Against Location)']);
      rows.push(['Zone','Count']);
      NET_ZONE_ORDER.forEach(function(key){ if(view.netCounts[key]) rows.push([netZoneLabel(key,false), view.netCounts[key]]); });
    }
    return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\n');
  }

  function renderStatsScreen(){
    var el = document.getElementById('screen-stats');
    if(!el) return;
    if(!STATS_FILTER.teamId || !getTeam(STATS_FILTER.teamId)) STATS_FILTER.teamId = DATA.activeTeamId;
    var elig = statsEligibleSessions();
    if(STATS_FILTER.sessionIds===null){
      STATS_FILTER.sessionIds = {};
      elig.forEach(function(s){ STATS_FILTER.sessionIds[s.id] = true; });
    }
    var opponents = statsDistinctOpponents(STATS_FILTER.teamId);
    var view = computeStatsView();
    var countChecked = elig.filter(function(s){ return STATS_FILTER.sessionIds[s.id]!==false; }).length;

    var checklistHtml = elig.length ? elig.map(function(s){
      var checked = STATS_FILTER.sessionIds[s.id]!==false;
      var tag = s.trackingMode==='team' ? 'Team' : 'Goalie';
      var bits = [fmtDate(s.date), (s.type==='practice'?'Practice':'Game'), tag];
      if(s.opponent) bits.push('vs '+s.opponent);
      if(s.homeAway) bits.push(s.homeAway==='home'?'Home':'Away');
      return '<label style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;">'+
        '<input type="checkbox" class="stats-session-cb" data-id="'+s.id+'" '+(checked?'checked':'')+' style="width:17px;height:17px;flex-shrink:0;">'+
        '<span>'+esc(bits.join(' · '))+'</span>'+
      '</label>';
    }).join('') : '<p class="center-note">No sessions match these filters.</p>';

    el.innerHTML =
      '<div class="section-head"><h2>Stats</h2></div>'+
      '<div class="panel">'+
        (teamList().length>1 ? ('<div class="field"><label>Team</label><select id="stTeam">'+
          teamList().map(function(t){ return '<option value="'+t.id+'"'+(t.id===STATS_FILTER.teamId?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('')+
        '</select></div>') : '')+
        '<div class="field"><label>Opponent</label><select id="stOpponent">'+
          '<option value="all"'+(STATS_FILTER.opponent==='all'?' selected':'')+'>All Opponents</option>'+
          opponents.map(function(o){ return '<option value="'+esc(o)+'"'+(STATS_FILTER.opponent===o?' selected':'')+'>'+esc(o)+'</option>'; }).join('')+
        '</select></div>'+
        '<div class="field"><label>Session Type</label><select id="stType">'+
          '<option value="all"'+(STATS_FILTER.sessionType==='all'?' selected':'')+'>All</option>'+
          '<option value="game"'+(STATS_FILTER.sessionType==='game'?' selected':'')+'>Game</option>'+
          '<option value="practice"'+(STATS_FILTER.sessionType==='practice'?' selected':'')+'>Practice</option>'+
        '</select></div>'+
        '<div class="field"><label>Home / Away</label><select id="stHomeAway">'+
          '<option value="all"'+(STATS_FILTER.homeAway==='all'?' selected':'')+'>All</option>'+
          '<option value="home"'+(STATS_FILTER.homeAway==='home'?' selected':'')+'>Home</option>'+
          '<option value="away"'+(STATS_FILTER.homeAway==='away'?' selected':'')+'>Away</option>'+
        '</select></div>'+
        '<div class="field"><label>Who</label><select id="stWho">'+statsWhoOptions(STATS_FILTER.teamId)+'</select></div>'+
      '</div>'+
      '<div class="panel">'+
        '<div class="section-head" style="margin-bottom:6px;"><h2 style="font-size:13px;">Games ('+countChecked+' of '+elig.length+' selected)</h2>'+
          '<div style="display:flex;gap:10px;">'+
            '<button class="link-btn" id="stSelAll">All</button>'+
            '<button class="link-btn" id="stSelNone">None</button>'+
          '</div>'+
        '</div>'+
        '<div style="max-height:220px;overflow-y:auto;">'+checklistHtml+'</div>'+
      '</div>'+
      renderStatsResultsHtml(view)+
      '<button class="btn btn-primary btn-full" id="stExportBtn">Export Summary (CSV)</button>'+
      '<p class="center-note" id="stExportNote"></p>';

    var teamEl = el.querySelector('#stTeam');
    if(teamEl) teamEl.addEventListener('change', function(){ STATS_FILTER.teamId = this.value; STATS_FILTER.opponent = 'all'; STATS_FILTER.sessionIds = null; renderStatsScreen(); });
    var opEl = el.querySelector('#stOpponent');
    if(opEl) opEl.addEventListener('change', function(){ STATS_FILTER.opponent = this.value; STATS_FILTER.sessionIds = null; renderStatsScreen(); });
    var tyEl = el.querySelector('#stType');
    if(tyEl) tyEl.addEventListener('change', function(){ STATS_FILTER.sessionType = this.value; STATS_FILTER.sessionIds = null; renderStatsScreen(); });
    var haEl = el.querySelector('#stHomeAway');
    if(haEl) haEl.addEventListener('change', function(){ STATS_FILTER.homeAway = this.value; STATS_FILTER.sessionIds = null; renderStatsScreen(); });
    var whoEl = el.querySelector('#stWho');
    if(whoEl) whoEl.addEventListener('change', function(){ STATS_FILTER.who = this.value; renderStatsScreen(); });
    var selAllBtn = el.querySelector('#stSelAll');
    if(selAllBtn) selAllBtn.addEventListener('click', function(){ elig.forEach(function(s){ STATS_FILTER.sessionIds[s.id] = true; }); renderStatsScreen(); });
    var selNoneBtn = el.querySelector('#stSelNone');
    if(selNoneBtn) selNoneBtn.addEventListener('click', function(){ elig.forEach(function(s){ STATS_FILTER.sessionIds[s.id] = false; }); renderStatsScreen(); });
    el.querySelectorAll('.stats-session-cb').forEach(function(cb){
      cb.addEventListener('change', function(){
        STATS_FILTER.sessionIds[cb.getAttribute('data-id')] = cb.checked;
        renderStatsScreen();
      });
    });
    var exportBtn = el.querySelector('#stExportBtn');
    if(exportBtn) exportBtn.addEventListener('click', function(){
      saveCSVFile('crease-log-stats-summary.csv', buildStatsSummaryCSV(view), document.getElementById('stExportNote'));
    });
  }

  function renderExport(){
    document.getElementById('exportNote').textContent = '';
    document.getElementById('exportBtn').onclick = doExport;
    document.getElementById('resetBtn').onclick = function(){
      confirmAction('Erase ALL sessions and shots for every goalie profile on this device? This cannot be undone.', function(){
        DATA = defaultData();
        persist();
        showScreen('home');
        showToast('All data erased.');
      });
    };
  }

  function csvEscape(v){
    if(v===null || v===undefined) return '';
    var s = String(v);
    if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
    return s;
  }

  function buildCSV(){
    /* Unified schema covering both Goalie Log and Team Log entries in one export —
       columns that don't apply to a given row are left blank rather than using a
       second export button. See docs/team-stats-spec.md decision 8. */
    var rows = [[
      'team','profile','session_date','session_type','format','opponent','drill','home_away','tracking_mode','mode',
      'period','clock','event_type','player_number','player_name','player_position','assist1','assist2',
      'goalie_number','goalie_name','ice_zone','net_zone','shot_type','rebound','situation','notes','timestamp'
    ]];
    DATA.sessions.forEach(function(s){
      var isTeam = s.trackingMode==='team';
      var teamName = (getTeam(s.teamId||DATA.activeTeamId)||{name:''}).name;
      var profile = DATA.profiles.filter(function(p){return p.id===s.profileId;})[0];
      var pname = profile ? profile.name : '';
      var flip = profile ? profile.flipSides : false;
      if(!s.entries.length){
        rows.push([
          teamName, pname, s.date, s.type, s.format, s.opponent, s.drill, s.homeAway||'', s.trackingMode||'goalie', s.mode||'',
          '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', s.notes, ''
        ]);
        return;
      }
      s.entries.forEach(function(e){
        if(isTeam){
          var player = e.playerId ? getRosterPlayer(e.playerId) : null;
          var goalieProf = e.goalieId ? DATA.profiles.filter(function(p){return p.id===e.goalieId;})[0] : null;
          var goalieRoster = e.goalieId ? getRosterPlayer(e.goalieId) : null;
          var a1 = e.assists && e.assists[0] ? getRosterPlayer(e.assists[0]) : null;
          var a2 = e.assists && e.assists[1] ? getRosterPlayer(e.assists[1]) : null;
          var netZoneStr = '';
          if(e.net){
            netZoneStr = e.type==='goalFor' ? netZoneLabel(e.net.zone, false) : netZoneLabel(e.net.zone, goalieProf?goalieProf.flipSides:false);
          }
          rows.push([
            teamName, pname, s.date, s.type, s.format, s.opponent, s.drill, s.homeAway||'', 'team', s.mode||'',
            e.period==='OT'?'OT':(e.period||''), e.clock||'',
            e.type,
            player?player.number:'', player?player.name:'', e.position||'',
            a1?a1.name:'', a2?a2.name:'',
            goalieRoster?goalieRoster.number:'', goalieProf?goalieProf.name:'',
            e.ice?iceZoneLabel(e.ice.zone):'', netZoneStr,
            '', '', '', s.notes,
            new Date(e.ts||s.createdAt||Date.now()).toISOString()
          ]);
        } else {
          rows.push([
            teamName, pname, s.date, s.type, s.format, s.opponent, s.drill, '', 'goalie', s.mode||'',
            e.period==='OT'?'OT':(e.period||''), e.clock||'',
            e.result,
            '', '', '',
            '', '',
            '', (DATA.profiles.filter(function(p){return p.id===(e.goalieId||s.profileId);})[0]||{name:pname}).name,
            e.ice?iceZoneLabel(e.ice.zone):'', e.net?netZoneLabel(e.net.zone, goalieFlipFor(e.goalieId)):'',
            e.shotType||'', e.rebound===true?'yes':(e.rebound===false?'no':''), e.situation||'', s.notes,
            new Date(e.ts||s.createdAt||Date.now()).toISOString()
          ]);
        }
      });
    });
    return rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
  }

  /* Shared CSV-download plumbing, factored out so the new Stats tab's
     "Export Summary" button can reuse it alongside the existing full-data
     export (2026-09-12). */
  function saveCSVFile(filename, csv, noteEl){
    if(window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(downloads){
        if(!downloads){ if(noteEl) noteEl.textContent = 'Export isn’t available in this view.'; return; }
        return downloads.save({filename:filename, data:csv});
      }).then(function(){
        if(noteEl) noteEl.textContent = 'Exported.';
      }).catch(function(err){
        if(noteEl) noteEl.textContent = 'Export failed or was cancelled.';
      });
    } else {
      if(noteEl) noteEl.textContent = 'Export isn’t available in this view.';
    }
  }
  function doExport(){
    saveCSVFile('crease-log-export.csv', buildCSV(), document.getElementById('exportNote'));
  }

  /* ================= boot ================= */
  var origShowScreen = showScreen;
  showScreen = function(name){
    origShowScreen(name);
    if(name==='detail') renderDetail();
  };

  renderHome();

  /* Register the offline service worker (see web/sw.js) so this app can be
     installed via "Add to Home Screen" and keep working with no internet
     after the first load. Feature-detected and wrapped so it's a silent
     no-op anywhere it isn't supported (e.g. inside the Android WebView app,
     which doesn't need it since it already loads everything from local
     assets) — added 2026-09-12, see STATUS.md. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* not available in this context — fine */ });
    });
  }
})();
</script>
