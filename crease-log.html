<style>
  :root{
    --ice:#F3F7FB;
    --surface:#FFFFFF;
    --surface-2:#EAF1F7;
    --ink:#0F2038;
    --ink-soft:#5B6B80;
    --line:#D8E2EC;
    --board:#1E3A5F;
    --blue:#2F5FA8;
    --blue-soft:#E4ECF7;
    --red:#D62839;
    --red-soft:#FBE2E4;
    --gold:#B9832A;
    --onboard:#FFFFFF;
    --shadow: 0 1px 2px rgba(15,32,56,.07), 0 6px 16px rgba(15,32,56,.08);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ice:#0A1526;
      --surface:#12233A;
      --surface-2:#182C46;
      --ink:#EAF2FA;
      --ink-soft:#93A8C0;
      --line:#233A56;
      --board:#8FB4DE;
      --blue:#6FA0E8;
      --blue-soft:#1B3454;
      --red:#FF6B72;
      --red-soft:#3A1B22;
      --gold:#E9C27A;
      --onboard:#0A1526;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ice:#0A1526;
    --surface:#12233A;
    --surface-2:#182C46;
    --ink:#EAF2FA;
    --ink-soft:#93A8C0;
    --line:#233A56;
    --board:#8FB4DE;
    --blue:#6FA0E8;
    --blue-soft:#1B3454;
    --red:#FF6B72;
    --red-soft:#3A1B22;
    --gold:#E9C27A;
    --onboard:#0A1526;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--ice);
    color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    margin:0;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',system-ui,sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-wrap:balance;
    margin:0;
  }
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--ice);
    position:relative;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:16px 18px 12px;
    position:sticky;
    top:0;
    background:var(--ice);
    z-index:5;
  }
  .topbar .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .topbar .brand h1{font-size:22px; color:var(--ink);}
  .topbar .brand .puck{
    width:10px;height:10px;border-radius:3px;background:var(--red);display:inline-block;
  }
  .profile-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:999px;
    padding:7px 12px 7px 10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .profile-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);}
  .profile-chip .car{color:var(--ink-soft); font-size:10px;}

  main#screens{
    flex:1;
    padding:4px 18px 100px;
    overflow-y:auto;
  }
  .screen[hidden]{display:none;}

  /* ---------- Home ---------- */
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:18px 0 10px;
  }
  .section-head h2{font-size:15px;color:var(--ink-soft); letter-spacing:.08em;}
  .btn{
    border:none;
    border-radius:12px;
    padding:12px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn-primary{background:var(--board); color:#fff;}
  .btn-red{background:var(--red); color:#fff;}
  .btn-blue{background:var(--blue); color:#fff;}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-outline{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-full{width:100%;}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:10px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .fab-row{margin:14px 0 4px;}

  .empty-state{
    text-align:center;
    padding:40px 18px;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
  }
  .empty-state .em-icon{font-size:34px; margin-bottom:8px; display:block;}

  .session-card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
    border:1px solid transparent;
  }
  .session-card:active{border-color:var(--line);}
  .sc-top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .sc-date{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .badge{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:999px;
  }
  .badge-game{background:var(--red-soft); color:var(--red);}
  .badge-practice{background:var(--blue-soft); color:var(--blue);}
  .badge-progress{background:var(--gold); color:#fff;}
  .badge-outline{border:1px solid var(--line); color:var(--ink-soft); background:transparent;}
  .sc-title{font-size:16px; font-weight:700; margin-bottom:4px;}
  .sc-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .sc-stats{display:flex; gap:14px; font-size:12.5px; color:var(--ink-soft);}
  .sc-stats b{color:var(--ink); font-family:'Oswald',sans-serif; font-size:14px;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    gap:6px;
    max-width:480px;
    margin:0 auto;
    width:100%;
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:6px 4px;
    border-radius:10px;
    color:var(--ink-soft);
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .nav-btn .ic{font-size:18px;}
  .nav-btn.active{color:var(--blue);}
  .nav-btn.active .ic{color:var(--red);}

  /* ---------- Track screen ---------- */
  .track-header{
    background:var(--board);
    color:var(--onboard);
    border-radius:var(--radius);
    padding:16px;
    margin-top:8px;
  }
  .track-header .th-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .track-header .th-title{font-size:18px; font-weight:700;}
  .track-header .th-meta{font-size:12px; opacity:.8; margin-top:2px;}
  .mode-toggle{
    display:flex; background:rgba(255,255,255,.15); border-radius:999px; padding:3px; gap:2px;
  }
  .mode-toggle button{
    border:none; background:transparent; color:inherit; font-size:11px; font-weight:700;
    padding:6px 10px; border-radius:999px; cursor:pointer; opacity:.7;
  }
  .mode-toggle button.active{background:#fff; color:#16304D; opacity:1;}

  .stat-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:14px;
  }
  .stat-tile{
    background:rgba(255,255,255,.08);
    border-radius:10px;
    padding:8px 4px;
    text-align:center;
  }
  .stat-tile .v{font-family:'Oswald',sans-serif; font-size:20px; font-variant-numeric:tabular-nums;}
  .stat-tile .l{font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.75; margin-top:2px;}

  .action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:18px 0 8px;
  }
  .action-btn{
    border:none;
    border-radius:18px;
    padding:26px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    color:#fff;
    box-shadow:var(--shadow);
  }
  .action-btn .ic{font-size:30px;}
  .action-btn .lbl{font-family:'Oswald',sans-serif; font-size:18px; letter-spacing:.04em;}
  .action-btn.shot{background:var(--blue);}
  .action-btn.goal{background:var(--red);}
  .action-btn.against{background:var(--board);}
  .action-btn.util{background:var(--gold);}
  .action-btn:active{transform:scale(.97);}

  .clk-box{min-width:64px; text-align:center; font-size:22px; font-weight:800; padding:12px 10px; border-radius:10px; background:var(--panel-2,#EEF2F7); border:2px solid var(--line); color:var(--ink-soft); cursor:pointer; font-family:'Oswald',sans-serif; letter-spacing:.04em;}
  .clk-box.on{border-color:var(--red); color:var(--ink); background:#fff;}
  .numpad{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
  .numpad-row{display:flex; gap:8px;}
  .numpad-key{flex:1; padding:14px 0; font-size:20px; font-weight:700; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;}
  .numpad-key:active{background:var(--panel-2,#EEF2F7); transform:scale(.97);}

  .undo-row{display:flex; gap:10px; margin-bottom:16px;}

  .log-list{display:flex; flex-direction:column; gap:6px;}
  .log-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border-radius:10px; padding:9px 12px;
    box-shadow:var(--shadow);
    font-size:13px;
  }
  .log-row .lr-left{display:flex; align-items:center; gap:8px;}
  .lr-chip{width:8px; height:8px; border-radius:50%;}
  .lr-chip.shot{background:var(--blue);}
  .lr-chip.goal{background:var(--red);}
  .lr-detail{color:var(--ink-soft); font-size:11.5px;}
  .lr-del{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:15px; padding:2px 6px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,15,25,.5);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-sheet{
    background:var(--surface);
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    animation:sheetUp .18s ease-out;
  }
  @keyframes sheetUp{from{transform:translateY(16px); opacity:.6;} to{transform:translateY(0); opacity:1;}}
  .modal-sheet.center{
    border-radius:20px;
    margin:0 16px;
  }
  .modal-overlay.center-align{align-items:center;}
  .modal-title{font-size:17px; font-weight:700; margin-bottom:4px;}
  .modal-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
  .steps-dots{display:flex; gap:5px; margin-bottom:12px;}
  .steps-dots span{width:20px; height:4px; border-radius:2px; background:var(--line);}
  .steps-dots span.on{background:var(--red);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .seg{display:flex; gap:8px;}
  .seg button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer;
  }
  .seg button.on{background:var(--board); color:#fff; border-color:var(--board);}

  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:8px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .chip.on{background:var(--red); color:#fff; border-color:var(--red);}
  .chip.on.blue{background:var(--blue); border-color:var(--blue);}

  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1;}

  svg.rink, svg.net{width:100%; display:block; border-radius:12px; background:var(--surface-2); touch-action:manipulation;}
  .tap-hint{font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:8px;}

  /* ---------- Detail / stats ---------- */
  .stat-tiles{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0;
  }
  .big-tile{
    background:var(--surface); border-radius:var(--radius); padding:14px 8px; text-align:center; box-shadow:var(--shadow);
  }
  .big-tile .v{font-family:'Oswald',sans-serif; font-size:26px;}
  .big-tile .v.red{color:var(--red);}
  .big-tile .v.blue{color:var(--blue);}
  .big-tile .l{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .panel{background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .panel h3{font-size:13px; color:var(--ink-soft); letter-spacing:.06em; margin-bottom:10px;}

  .breakdown-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--line);}
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-row .k{color:var(--ink-soft);}
  .breakdown-row .v{font-weight:700; font-family:'Oswald',sans-serif;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--ice); padding:10px 16px; border-radius:999px;
    font-size:13px; font-weight:600; z-index:80; box-shadow:var(--shadow);
    max-width:90%;
  }
  :root:not([data-theme="light"]) .toast, :root[data-theme="dark"] .toast{background:var(--surface-2); color:var(--ink); border:1px solid var(--line);}

  .link-btn{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;}
  .center-note{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:10px;}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="puck"></span>
      <h1>Crease Log</h1>
    </div>
    <button class="profile-chip" id="profileBtn"><span class="dot"></span><span id="profileName">Me</span><span class="car">▾</span></button>
  </header>

  <main id="screens">
    <section class="screen" id="screen-home">
      <div class="section-head"><h2>Sessions</h2></div>
      <div class="fab-row">
        <button class="btn btn-red btn-full" id="newSessionBtn">＋ New Session</button>
      </div>
      <div id="sessionsList"></div>
    </section>

    <section class="screen" id="screen-track" hidden></section>

    <section class="screen" id="screen-detail" hidden></section>

    <section class="screen" id="screen-team" hidden></section>

    <section class="screen" id="screen-stats" hidden></section>

    <section class="screen" id="screen-export" hidden>
      <div class="section-head"><h2>Export</h2></div>
      <div class="panel">
        <h3>Back up your data</h3>
        <p style="font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px;">Export every logged session and shot as a CSV file you can open in a spreadsheet.</p>
        <button class="btn btn-primary btn-full" id="exportBtn">Export all data (CSV)</button>
        <p class="center-note" id="exportNote"></p>
      </div>
      <div class="panel">
        <h3>Reset</h3>
        <p style="font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 12px;">Data is stored only on this device/browser. Clearing it cannot be undone — export first if you want a copy.</p>
        <button class="btn btn-outline btn-full" id="resetBtn">Erase all data</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="home"><span class="ic">🏒</span>Home</button>
    <button class="nav-btn" data-nav="track"><span class="ic">🎯</span>Track</button>
    <button class="nav-btn" data-nav="team"><span class="ic">👥</span>Team</button>
    <button class="nav-btn" data-nav="stats"><span class="ic">📊</span>Stats</button>
    <button class="nav-btn" data-nav="export"><span class="ic">⇩</span>Export</button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- constants ---------------- */
  var SHOT_TYPES = ['Wrist Shot','Slap Shot','One-Timer','Deflection','Backhand','Breakaway','Other'];
  var SITUATIONS = ['Even Strength','Opp. Power Play','Shorthanded (PK)','Empty Net'];
  var FORMATS = ['Full Ice','Half Ice','3v3','Small Area Games','Other'];

  /* ---- ice shot-location zones (docs/zones.md — shot-zones.png, pinned to real NHL rink markings) ---- */
  var ICE_ZONES = [
    {key:'highSlot',    label:'High Slot',    lines:['High','Slot'],    color:'#3FAF95'},
    {key:'lowSlot',     label:'Low Slot',     lines:['Low','Slot'],     color:'#2F6FD1'},
    {key:'leftCircle',  label:'Left Circle',  lines:['Left','Circle'],  color:'#C9932E'},
    {key:'rightCircle', label:'Right Circle', lines:['Right','Circle'], color:'#D9762E'},
    {key:'point',       label:'Point',        lines:['Point'],         color:'#B23A63'}
  ];
  var ICE_ZONE_BY_KEY = {};
  ICE_ZONES.forEach(function(z){ ICE_ZONE_BY_KEY[z.key] = z; });
  function iceZoneLabel(key){ return ICE_ZONE_BY_KEY[key] ? ICE_ZONE_BY_KEY[key].label : ''; }

  /* ---- net-location "5-hole" zones (docs/zones.md — net-holes.png shape + goalie-style-ref.png gear) ----
     Zone keys are physical (left/right) and fixed; netSide()/netZoneLabel() map them to Glove/Blocker
     for display according to the goalie's handedness (flipSides). Default (no flip): left = Blocker
     (stick side), right = Glove side — matching both reference images. */
  function netSide(physKey, flip){
    var isLeft = (physKey==='leftHigh' || physKey==='leftLow');
    if(flip) isLeft = !isLeft;
    return isLeft ? 'Blocker' : 'Glove';
  }
  var NET_ZONES = [
    {key:'leftHigh',  color:'#8A5FD1'},
    {key:'rightHigh', color:'#D9762E'},
    {key:'leftLow',   color:'#2F6FD1'},
    {key:'rightLow',  color:'#C9932E'},
    {key:'fiveHole',  color:'#B23A63'},
    {key:'openNet',   color:'#64748B'}
  ];
  function netZoneLabel(key, flip){
    if(key==='fiveHole') return 'Five-Hole';
    if(key==='openNet') return 'Open Net';
    return netSide(key,flip) + ((key==='leftHigh'||key==='rightHigh') ? ' High' : ' Low (Pad)');
  }
  function netZoneLabelLines(key, flip){
    if(key==='fiveHole') return ['Five-Hole'];
    if(key==='openNet') return ['Open','Net'];
    return [netSide(key,flip), (key==='leftHigh'||key==='rightHigh') ? 'High' : 'Low (Pad)'];
  }
  function stackedLabelSvg(lines, lx, ly, fontSize, color){
    return lines.map(function(ln,i){
      var yOff = (lines.length-1)*-(fontSize*0.62) + i*(fontSize*1.24);
      return '<text x="'+lx+'" y="'+(ly+yOff)+'" font-size="'+fontSize+'" text-anchor="middle" fill="'+color+'" font-family="Archivo, sans-serif" font-weight="700" style="text-transform:uppercase; letter-spacing:.02em;" pointer-events="none">'+esc(ln.toUpperCase())+'</text>';
    }).join('');
  }

  /* ---------------- storage ---------------- */
  var STORE_KEY = 'creaseLogData_v1';
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }

  function defaultData(){
    var tid = uid();
    var pid = uid();
    return {
      teams: [{id:tid, name:'My Team'}],
      activeTeamId: tid,
      profiles: [{id:pid, name:'Me', flipSides:false, teamId:tid}],
      activeProfileId: pid,
      activeSessionId: null,
      sessions: [],
      roster: []
    };
  }

  var DATA = load();
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return defaultData();
      var parsed = JSON.parse(raw);
      if(!parsed || !parsed.profiles || !parsed.profiles.length) return defaultData();
      if(!parsed.roster) parsed.roster = [];
      /* Multi-team migration (2026-09-12): everything before this was implicitly
         one team. Fold existing profiles/roster/sessions into a single default
         team so nothing changes for existing data until a second team is added. */
      if(!parsed.teams || !parsed.teams.length){
        var tid = uid();
        parsed.teams = [{id:tid, name:'My Team'}];
        parsed.activeTeamId = tid;
        parsed.profiles.forEach(function(p){ if(!p.teamId) p.teamId = tid; });
        parsed.roster.forEach(function(r){ if(!r.teamId) r.teamId = tid; });
        (parsed.sessions||[]).forEach(function(s){ if(!s.teamId) s.teamId = tid; });
      }
      if(!parsed.activeTeamId) parsed.activeTeamId = parsed.teams[0].id;
      return parsed;
    }catch(e){ return defaultData(); }
  }
  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
    catch(e){ showToast('Could not save — device storage may be full.'); }
  }
  function activeProfile(){
    var p = DATA.profiles.filter(function(x){return x.id===DATA.activeProfileId;})[0];
    if(p) return p;
    return DATA.profiles.filter(function(x){return x.teamId===DATA.activeTeamId;})[0] || DATA.profiles[0];
  }

  /* ---------------- teams ----------------
     Ben's 2026-09-12 request: support multiple fully-separate teams (own
     roster + own goalie pool each — a goalie who plays for two teams gets a
     separate profile/identity per team, same as any other roster player).
     Existing single-roster data was migrated into one default team in load()
     above, so nothing changes until a second team actually exists. */
  function teamList(){ if(!DATA.teams) DATA.teams=[]; return DATA.teams; }
  function getTeam(id){ return teamList().filter(function(t){return t.id===id;})[0]; }
  function activeTeam(){ return getTeam(DATA.activeTeamId) || teamList()[0]; }
  function switchActiveTeam(teamId){
    if(teamId===DATA.activeTeamId) return;
    DATA.activeTeamId = teamId;
    var teamProfiles = DATA.profiles.filter(function(p){return p.teamId===teamId;});
    if(!teamProfiles.length){
      var np = {id:uid(), name:'Me', flipSides:false, teamId:teamId};
      DATA.profiles.push(np);
      teamProfiles = [np];
    }
    if(!teamProfiles.some(function(p){return p.id===DATA.activeProfileId;})){
      DATA.activeProfileId = teamProfiles[0].id;
    }
    persist();
  }
  function addTeam(name){
    var t = {id:uid(), name:name};
    teamList().push(t);
    persist();
    return t;
  }
  function renameTeam(id, name){
    var t = getTeam(id);
    if(t){ t.name = name; persist(); }
  }
  function profileSessions(){
    return DATA.sessions.filter(function(s){return s.profileId===DATA.activeProfileId;});
  }
  function getSession(id){ return DATA.sessions.filter(function(s){return s.id===id;})[0]; }

  /* ---------------- team roster ----------------
     Persistent, device-wide, reused across every game (not rebuilt per session).
     A roster entry with position 'G' shares its id with a DATA.profiles entry
     (created automatically), so a roster goalie's identity/handedness/save% is
     the same one used by standalone Goalie Log tracking — one goalie record,
     fed from either mode. See docs/team-stats-spec.md. */
  /* rosterList() returns only the ACTIVE team's players — a filtered view, not
     DATA.roster itself. addRosterPlayer/removeRosterPlayer below deliberately
     mutate DATA.roster directly (never reassign from a filtered rosterList()
     result) so other teams' rosters are never touched. */
  function rosterList(){ if(!DATA.roster) DATA.roster=[]; return DATA.roster.filter(function(p){return p.teamId===DATA.activeTeamId;}); }
  function getRosterPlayer(id){ if(!DATA.roster) DATA.roster=[]; return DATA.roster.filter(function(p){return p.id===id;})[0]; }
  function addRosterPlayer(number, name, position){
    if(!DATA.roster) DATA.roster=[];
    var id;
    if(position==='G'){
      var prof = {id:uid(), name:name, flipSides:false, teamId:DATA.activeTeamId};
      DATA.profiles.push(prof);
      id = prof.id;
    } else {
      id = uid();
    }
    DATA.roster.push({id:id, number:number, name:name, position:position, teamId:DATA.activeTeamId});
    persist();
  }
  function removeRosterPlayer(id){
    if(!DATA.roster) DATA.roster=[];
    DATA.roster = DATA.roster.filter(function(p){return p.id!==id;});
    /* The linked DATA.profiles entry (if any) is left in place on purpose — past
       sessions/entries still reference it by id, so removing a goalie from the
       active roster must not orphan their historical stats. */
    persist();
  }
  function rosterListForTeam(teamId){ if(!DATA.roster) DATA.roster=[]; return DATA.roster.filter(function(p){return p.teamId===teamId;}); }
  function rosterByPositionForTeam(teamId){
    var groups = {F:[], D:[], G:[]};
    rosterListForTeam(teamId).forEach(function(p){ (groups[p.position]||groups.F).push(p); });
    Object.keys(groups).forEach(function(k){
      groups[k].sort(function(a,b){ return (parseInt(a.number,10)||0)-(parseInt(b.number,10)||0); });
    });
    return groups;
  }
  function rosterByPosition(){ return rosterByPositionForTeam(DATA.activeTeamId); }

  /* ---------------- nav ---------------- */
  var screens = ['home','track','export','detail','team','stats'];
  function showScreen(name){
    screens.forEach(function(s){
      var el = document.getElementById('screen-'+s);
      if(el) el.hidden = (s!==name);
    });
    document.querySelectorAll('.nav-btn').forEach(function(b){
      var n = b.getAttribute('data-nav');
      b.classList.toggle('active', n===name || (name==='detail' && n==='home'));
    });
    window.scrollTo(0,0);
    if(name==='home') renderHome();
    if(name==='track') renderTrack();
    if(name==='export') renderExport();
    if(name==='team') renderTeamScreen();
    if(name==='stats') renderStatsScreen();
  }
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.addEventListener('click', function(){
      var nav = b.getAttribute('data-nav');
      if(nav==='track' && !DATA.activeSessionId){
        showToast('Start or open a session first.');
        showScreen('home');
        return;
      }
      showScreen(nav);
    });
  });

  /* ---------------- toast ---------------- */
  var toastTimer=null;
  function showToast(msg){
    var root = document.getElementById('toastRoot');
    root.innerHTML = '<div class="toast">'+esc(msg)+'</div>';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ root.innerHTML=''; }, 2200);
  }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtDate(iso){
    try{
      var d = new Date(iso+'T00:00:00');
      return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
    }catch(e){ return iso; }
  }

  /* ---------------- modal helpers ---------------- */
  function openModal(html, opts){
    opts = opts||{};
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-overlay'+(opts.center?' center-align':'')+'" id="ovl"><div class="modal-sheet'+(opts.center?' center':'')+'">'+html+'</div></div>';
    var ovl = document.getElementById('ovl');
    ovl.addEventListener('click', function(e){ if(e.target===ovl && opts.dismissable!==false) closeModal(); });
    if(opts.onMount) opts.onMount(root);
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

  function confirmAction(message, onYes){
    openModal(
      '<div class="modal-title">Please confirm</div>'+
      '<div class="modal-sub">'+esc(message)+'</div>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="cAcNo">Cancel</button>'+
        '<button class="btn btn-red" id="cAcYes">Confirm</button>'+
      '</div>', {center:true, onMount:function(root){
        root.querySelector('#cAcNo').addEventListener('click', closeModal);
        root.querySelector('#cAcYes').addEventListener('click', function(){ closeModal(); onYes(); });
      }});
  }

  /* ================= HOME ================= */
  function renderHome(){
    document.getElementById('profileName').textContent = activeProfile().name;
    var list = profileSessions().slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    var wrap = document.getElementById('sessionsList');
    if(!list.length){
      wrap.innerHTML = '<div class="empty-state"><span class="em-icon">🥅</span>No sessions yet.<br>Tap “+ New Session” to start tracking.</div>';
      return;
    }
    wrap.innerHTML = list.map(function(s){
      var isTeam = s.trackingMode==='team';
      var sub = s.type==='game' ? (s.opponent ? ('vs '+s.opponent) : 'Game') : (s.drill || 'Practice');
      var statsHtml;
      if(isTeam){
        var gf = s.entries.filter(function(e){return e.type==='goalFor';}).length;
        var ga = s.entries.filter(function(e){return e.type==='goalAgainst';}).length;
        var sf = s.entries.filter(function(e){return e.type==='shotFor';}).length;
        var sa = s.entries.filter(function(e){return e.type==='shotAgainst';}).length;
        statsHtml = '<div class="sc-stats"><span><b>'+gf+'-'+ga+'</b> GF-GA</span><span><b>'+sf+'</b> SF</span><span><b>'+sa+'</b> SA</span></div>';
      } else {
        var shots = s.entries.filter(function(e){return e.result==='shot';}).length;
        var goals = s.entries.filter(function(e){return e.result==='goal';}).length;
        var total = shots+goals;
        var pct = total ? Math.round(shots/total*1000)/10 : 0;
        statsHtml = '<div class="sc-stats"><span><b>'+total+'</b> shots</span><span><b>'+goals+'</b> goals</span><span><b>'+pct+'%</b> saves</span></div>';
      }
      return (
        '<div class="session-card" data-id="'+s.id+'">'+
          '<div class="sc-top">'+
            '<span class="sc-date">'+fmtDate(s.date)+'</span>'+
            (s.finishedAt ? '' : '<span class="badge badge-progress">In Progress</span>')+
          '</div>'+
          '<div class="sc-title">'+
            '<span class="badge '+(s.type==='game'?'badge-game':'badge-practice')+'">'+(s.type==='game'?'Game':'Practice')+'</span> '+
            (isTeam?'<span class="badge badge-outline">Team Log</span> ':'')+
            esc(s.format||'')+
          '</div>'+
          '<div class="sc-sub">'+esc(sub)+(isTeam?'':(' · '+(s.mode==='detailed'?'Detailed':'Simple')+' mode'))+'</div>'+
          statsHtml+
        '</div>'
      );
    }).join('');
    wrap.querySelectorAll('.session-card').forEach(function(card){
      card.addEventListener('click', function(){
        var s = getSession(card.getAttribute('data-id'));
        if(!s) return;
        if(!s.finishedAt){ DATA.activeSessionId = s.id; persist(); showScreen('track'); }
        else { openSessionDetail(s.id); }
      });
    });
  }

  document.getElementById('newSessionBtn').addEventListener('click', openNewSessionModal);
  document.getElementById('profileBtn').addEventListener('click', openProfileModal);

  function openProfileModal(){
    var teamProfiles = DATA.profiles.filter(function(p){return p.teamId===DATA.activeTeamId;});
    var opts = teamProfiles.map(function(p){
      return '<button class="seg-profile" data-id="'+p.id+'" style="display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:'+(p.id===DATA.activeProfileId?'var(--blue-soft)':'var(--surface-2)')+';color:var(--ink);font-weight:600;font-size:14px;margin-bottom:8px;cursor:pointer;">'+esc(p.name)+(p.id===DATA.activeProfileId?' ✓':'')+'</button>';
    }).join('');
    openModal(
      '<div class="modal-title">Goalies</div>'+
      '<div class="modal-sub">Switch profile or add another goalie to track separately. Showing '+esc(activeTeam().name)+'’s goalies — switch teams from the Team tab to see another team’s.</div>'+
      opts+
      '<div class="field" style="margin-top:10px;">'+
        '<label>Add a goalie</label>'+
        '<div style="display:flex; gap:8px;">'+
          '<input type="text" id="newProfileName" placeholder="e.g. Alex">'+
          '<button class="btn btn-primary" id="addProfileBtn">Add</button>'+
        '</div>'+
      '</div>'+
      '<div class="field">'+
        '<label>Glove / blocker side</label>'+
        '<div class="seg">'+
          '<button id="flipNo" class="'+(activeProfile().flipSides? '':'on')+'">Glove = Left</button>'+
          '<button id="flipYes" class="'+(activeProfile().flipSides? 'on':'')+'">Glove = Right</button>'+
        '</div>'+
      '</div>',
      {center:true, onMount:function(root){
        root.querySelectorAll('.seg-profile').forEach(function(b){
          b.addEventListener('click', function(){
            DATA.activeProfileId = b.getAttribute('data-id');
            persist(); closeModal(); showScreen('home');
          });
        });
        root.querySelector('#addProfileBtn').addEventListener('click', function(){
          var name = root.querySelector('#newProfileName').value.trim();
          if(!name){ showToast('Enter a name first.'); return; }
          var np = {id:uid(), name:name, flipSides:false, teamId:DATA.activeTeamId};
          DATA.profiles.push(np);
          DATA.activeProfileId = np.id;
          persist(); closeModal(); showScreen('home');
          showToast('Added '+name+'.');
        });
        function setFlip(v){
          activeProfile().flipSides = v; persist();
          root.querySelector('#flipNo').classList.toggle('on', !v);
          root.querySelector('#flipYes').classList.toggle('on', v);
        }
        root.querySelector('#flipNo').addEventListener('click', function(){ setFlip(false); });
        root.querySelector('#flipYes').addEventListener('click', function(){ setFlip(true); });
      }}
    );
  }

  function openNewSessionModal(){
    var state = {type:'game', format:'Full Ice', mode:'simple', trackingMode:'goalie', homeAway:'home', goalieInNetId:null};
    function body(){
      return (
        '<div class="modal-title">New Session</div>'+
        '<div class="modal-sub">Set the context once — stats and maps are tracked live. Team: <b>'+esc(activeTeam().name)+'</b> (switch teams from the Team tab first if this is for a different one).</div>'+
        '<div class="field"><label>Log type</label><div class="seg" id="nsLogType">'+
          '<button data-v="goalie" class="'+(state.trackingMode==='goalie'?'on':'')+'">Goalie Log</button>'+
          '<button data-v="team" class="'+(state.trackingMode==='team'?'on':'')+'">Team Log</button>'+

        '<div class="field"><label>Type</label><div class="seg" id="nsType">'+
          '<button data-v="game" class="'+(state.type==='game'?'on':'')+'">Game</button>'+
          '<button data-v="practice" class="'+(state.type==='practice'?'on':'')+'">Practice</button>'+
        '</div></div>'+
        '<div class="field"><label>Format</label><select id="nsFormat">'+
          FORMATS.map(function(f){return '<option value="'+f+'" '+(f===state.format?'selected':'')+'>'+f+'</option>';}).join('')+
        '</select></div>'+
        '<div class="field" id="nsFormatOtherWrap" style="'+(state.format==='Other'?'':'display:none;')+'">'+

        '<div class="field" id="nsTeamFieldsWrap"></div>'+
        '<div class="field"><label>Period length (minutes)</label><input type="number" id="nsPeriodLen" min="1" max="60" value="'+DEFAULT_PERIOD_LENGTH_MIN+'"></div>'+
        '<div class="field"><label>Notes (optional)</label><textarea id="nsNotes" placeholder="Anything worth remembering..."></textarea></div>'+

          '<button class="btn btn-ghost" id="nsCancel">Cancel</button>'+
          '<button class="btn btn-red" id="nsStart">Start Session</button>'+

      );
    }
    function renderContext(root){
      var wrap = root.querySelector('#nsContextWrap');
      if(state.type==='game'){
        wrap.innerHTML = '<label>Opponent (optional)</label><input type="text" id="nsOpponent" placeholder="e.g. River City Hawks">';
      }else{
        wrap.innerHTML = '<label>Drill / exercise (optional)</label><input type="text" id="nsDrill" placeholder="e.g. Odd-man rush drill">';

    function renderTeamFields(root){
      var wrap = root.querySelector('#nsTeamFieldsWrap');
      if(state.trackingMode!=='team'){ wrap.innerHTML=''; return; }
      var goalies = rosterByPosition().G;
      wrap.innerHTML =
        (state.type==='game' ? (
          '<label>Home / Away</label><div class="seg" id="nsHomeAway">'+
            '<button data-v="home" class="'+(state.homeAway==='home'?'on':'')+'">Home</button>'+
            '<button data-v="away" class="'+(state.homeAway==='away'?'on':'')+'">Away</button>'+
          '</div>'
        ) : '')+
        '<label style="margin-top:10px;display:block;">Goalie in net</label>'+
        (goalies.length ?
          ('<select id="nsGoalie"><option value="">— set later</option>'+
            goalies.map(function(g){return '<option value="'+g.id+'">#'+esc(g.number||'')+' '+esc(g.name)+'</option>';}).join('')+
          '</select>')
          : '<p class="center-note">No goalies on the roster yet — add one from the Team tab, or set it later.</p>');
      var haSeg = wrap.querySelector('#nsHomeAway');
      if(haSeg) haSeg.addEventListener('click', function(e){
        var b=e.target.closest('button'); if(!b) return;
        state.homeAway = b.getAttribute('data-v');
        haSeg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on', x===b);});
      });
      var gsel = wrap.querySelector('#nsGoalie');
      if(gsel) gsel.addEventListener('change', function(){ state.goalieInNetId = this.value || null; });
    }
    function renderModeField(root){
      var wrap = root.querySelector('#nsModeWrap');
      if(state.trackingMode==='team'){ wrap.innerHTML=''; return; }
      wrap.innerHTML = '<label>Tracking mode</label><div class="seg" id="nsMode">'+
          '<button data-v="simple" class="'+(state.mode==='simple'?'on':'')+'">Simple</button>'+
          '<button data-v="detailed" class="'+(state.mode==='detailed'?'on':'')+'">Detailed</button>'+
        '</div>';
      wrap.querySelector('#nsMode').addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        state.mode = b.getAttribute('data-v');
        wrap.querySelectorAll('#nsMode button').forEach(function(x){x.classList.toggle('on', x===b);});
      });

    openModal(body(), {onMount:function(root){
      renderContext(root);
      renderTeamFields(root);
      renderModeField(root);
      root.querySelector('#nsLogType').addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        state.trackingMode = b.getAttribute('data-v');
        root.querySelectorAll('#nsLogType button').forEach(function(x){x.classList.toggle('on', x===b);});
        renderTeamFields(root);
        renderModeField(root);
      });
      root.querySelector('#nsType').addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        state.type = b.getAttribute('data-v');
        root.querySelectorAll('#nsType button').forEach(function(x){x.classList.toggle('on', x===b);});
        renderContext(root);
        renderTeamFields(root);
      });
      root.querySelector('#nsFormat').addEventListener('change', function(){
        state.format = this.value;
        root.querySelector('#nsFormatOtherWrap').style.display = state.format==='Other' ? '' : 'none';
      });
      root.querySelector('#nsCancel').addEventListener('click', closeModal);
      root.querySelector('#nsStart').addEventListener('click', function(){
        var date = root.querySelector('#nsDate').value || todayISO();
        var format = state.format;
        if(format==='Other'){
          var custom = root.querySelector('#nsFormatOther').value.trim();
          format = custom || 'Other';
        }
        var periodLen = parseInt(root.querySelector('#nsPeriodLen').value,10) || DEFAULT_PERIOD_LENGTH_MIN;
        var initialGoalieId = state.trackingMode==='team' ? state.goalieInNetId : DATA.activeProfileId;
        var session = {
          id: uid(),
          teamId: DATA.activeTeamId,
          profileId: DATA.activeProfileId,
          date: date,
          type: state.type,
          format: format,
          opponent: state.type==='game' ? (root.querySelector('#nsOpponent')||{value:''}).value.trim() : '',
          drill: state.type==='practice' ? (root.querySelector('#nsDrill')||{value:''}).value.trim() : '',
          notes: root.querySelector('#nsNotes').value.trim(),
          mode: state.mode,
          trackingMode: state.trackingMode,
          homeAway: state.trackingMode==='team' ? state.homeAway : '',
          periodLengthMin: periodLen,
          goalieInNetId: initialGoalieId,
          goalieStints: initialGoalieId ? [{goalieId:initialGoalieId, period:1, clock:null, ts:Date.now()}] : [],
          currentPeriod: 1,
          activeRosterIds: null,
          createdAt: Date.now(),
          finishedAt: null,
          entries: []
        };
        function launch(){
          DATA.sessions.push(session);
          DATA.activeSessionId = session.id;
          persist();
          closeModal();
          showScreen('track');
        }
        if(state.trackingMode==='team' && rosterList().length){
          closeModal();
          openGameRosterStep(function(activeIds){
            session.activeRosterIds = activeIds;
            launch();
          });
        } else {
          launch();
        }
      });
    }});
  }

  /* Edit an existing session's info (date, type, format, opponent/drill,
     home/away, period length, notes) — added per Ben's request to be able
     to fix session details after starting. Log type and team are fixed
     (not editable here); period-length edits just recompute minutes/GAA
     going forward since computeGoalieMinutes/computeGAA read s.periodLengthMin
     live rather than caching it. */
  function openEditSessionModal(s, onSaved){
    var isTeam = s.trackingMode==='team';
    var state = {
      type: s.type,
      format: FORMATS.indexOf(s.format)!==-1 ? s.format : 'Other',
      formatOther: FORMATS.indexOf(s.format)!==-1 ? '' : (s.format||''),
      homeAway: s.homeAway || 'home'
    };
    function body(){
      return (
        '<div class="modal-title">Edit Session Info</div>'+
        '<div class="modal-sub">'+(isTeam?'Team Log':'Goalie Log')+' · Team: <b>'+esc((getTeam(s.teamId)||{name:'—'}).name)+'</b></div>'+
        '<div class="field"><label>Date</label><input type="date" id="esDate" value="'+esc(s.date||todayISO())+'"></div>'+
        '<div class="field"><label>Type</label><div class="seg" id="esType">'+
          '<button data-v="game" class="'+(state.type==='game'?'on':'')+'">Game</button>'+
          '<button data-v="practice" class="'+(state.type==='practice'?'on':'')+'">Practice</button>'+
        '</div></div>'+
        '<div class="field"><label>Format</label><select id="esFormat">'+
          FORMATS.map(function(f){return '<option value="'+f+'" '+(f===state.format?'selected':'')+'>'+f+'</option>';}).join('')+
        '</select></div>'+
        '<div class="field" id="esFormatOtherWrap" style="'+(state.format==='Other'?'':'display:none;')+'">'+
          '<label>Custom format</label><input type="text" id="esFormatOther" value="'+esc(state.formatOther)+'" placeholder="e.g. 2v0 shootout"></div>'+
        '<div class="field" id="esContextWrap"></div>'+
        (isTeam ? '<div class="field" id="esHomeAwayWrap"></div>' : '')+
        '<div class="field"><label>Period length (minutes)</label><input type="number" id="esPeriodLen" min="1" max="60" value="'+(s.periodLengthMin||DEFAULT_PERIOD_LENGTH_MIN)+'"></div>'+
        '<div class="field"><label>Notes (optional)</label><textarea id="esNotes" placeholder="Anything worth remembering...">'+esc(s.notes||'')+'</textarea></div>'+
        '<div class="modal-actions">'+
          '<button class="btn btn-ghost" id="esCancel">Cancel</button>'+
          '<button class="btn btn-red" id="esSave">Save Changes</button>'+
        '</div>'
      );
    }
    function renderContext(root){
      var wrap = root.querySelector('#esContextWrap');
      if(state.type==='game'){
        wrap.innerHTML = '<label>Opponent (optional)</label><input type="text" id="esOpponent" value="'+esc(s.opponent||'')+'" placeholder="e.g. River City Hawks">';
      }else{
        wrap.innerHTML = '<label>Drill / exercise (optional)</label><input type="text" id="esDrill" value="'+esc(s.drill||'')+'" placeholder="e.g. Odd-man rush drill">';
      }
    }
    function renderHomeAway(root){
      if(!isTeam) return;
      var wrap = root.querySelector('#esHomeAwayWrap');
      if(!wrap) return;
      if(state.type!=='game'){ wrap.innerHTML=''; return; }
      wrap.innerHTML = '<label>Home / Away</label><div class="seg" id="esHomeAway">'+
          '<button data-v="home" class="'+(state.homeAway==='home'?'on':'')+'">Home</button>'+
          '<button data-v="away" class="'+(state.homeAway==='away'?'on':'')+'">Away</button>'+
        '</div>';
      wrap.querySelector('#esHomeAway').addEventListener('click', function(e){
        var b=e.target.closest('button'); if(!b) return;
        state.homeAway = b.getAttribute('data-v');
        wrap.querySelectorAll('#esHomeAway button').forEach(function(x){x.classList.toggle('on', x===b);});
      });
    }
    openModal(body(), {onMount:function(root){
      renderContext(root);
      renderHomeAway(root);
      root.querySelector('#esType').addEventListener('click', function(e){
        var b = e.target.closest('button'); if(!b) return;
        state.type = b.getAttribute('data-v');
        root.querySelectorAll('#esType button').forEach(function(x){x.classList.toggle('on', x===b);});
        renderContext(root);
        renderHomeAway(root);
      });
      root.querySelector('#esFormat').addEventListener('change', function(){
        state.format = this.value;
        root.querySelector('#esFormatOtherWrap').style.display = state.format==='Other' ? '' : 'none';
      });
      root.querySelector('#esCancel').addEventListener('click', closeModal);
      root.querySelector('#esSave').addEventListener('click', function(){
        var date = root.querySelector('#esDate').value || s.date || todayISO();
        var format = state.format;
        if(format==='Other'){
          var custom = root.querySelector('#esFormatOther').value.trim();
          format = custom || 'Other';
        }
        var periodLen = parseInt(root.querySelector('#esPeriodLen').value,10) || s.periodLengthMin || DEFAULT_PERIOD_LENGTH_MIN;

    }});

  /* ================= TRACK ================= */
  function renderTrack(){
    var el = document.getElementById('screen-track');
    var s = getSession(DATA.activeSessionId);
    if(!s){ el.innerHTML = '<div class="empty-state">No active session.</div>'; return; }
    if(s.trackingMode==='team'){ renderTrackTeam(s); return; }

    var shots = s.entries.filter(function(e){return e.result==='shot';}).length;
    var goals = s.entries.filter(function(e){return e.result==='goal';}).length;
    var total = shots+goals;
    var pct = total ? Math.round(shots/total*1000)/10 : 0;
    var sub = (s.type==='game'?'Game':'Practice') + ' · ' + s.format + (s.opponent?(' · vs '+s.opponent):'') + (s.drill?(' · '+s.drill):'');
    var curGoalieId = s.goalieInNetId || s.profileId;
    var curGoalie = DATA.profiles.filter(function(p){return p.id===curGoalieId;})[0];

    el.innerHTML =
      '<div class="track-header">'+
        '<div class="th-top">'+
          '<div><div class="th-title">'+fmtDate(s.date)+'</div><div class="th-meta">'+esc(sub)+'</div></div>'+
          '<div class="mode-toggle" id="trkMode">'+
            '<button data-v="simple" class="'+(s.mode==='simple'?'active':'')+'">Simple</button>'+
            '<button data-v="detailed" class="'+(s.mode==='detailed'?'active':'')+'">Detailed</button>'+
          '</div>'+
        '</div>'+
        '<div class="mode-toggle" id="trkPeriod" style="margin-top:10px;">'+
          PERIODS.map(function(p){ return '<button data-v="'+p+'" class="'+(String(s.currentPeriod||1)===String(p)?'active':'')+'">'+periodLabel(p)+'</button>'; }).join('')+
        '</div>'+
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 2px 0;font-size:13px;opacity:.85;">'+
          '<span>In net: <b>'+esc(curGoalie?curGoalie.name:'')+'</b></span>'+
          '<span><button class="link-btn" id="btnEditSessionInfo" style="color:#fff;text-decoration:underline;margin-right:12px;">Edit Info</button>'+
          '<button class="link-btn" id="btnSwitchGoalieLog" style="color:#fff;text-decoration:underline;">Switch</button></span>'+
        '</div>'+
        '<div class="stat-row">'+
          '<div class="stat-tile"><div class="v num">'+total+'</div><div class="l">Shots Faced</div></div>'+
          '<div class="stat-tile"><div class="v num">'+shots+'</div><div class="l">Saves</div></div>'+
          '<div class="stat-tile"><div class="v num">'+goals+'</div><div class="l">Goals</div></div>'+
          '<div class="stat-tile"><div class="v num">'+pct+'%</div><div class="l">Save %</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="action-grid">'+
        '<button class="action-btn shot" id="btnShot"><span class="ic">🧤</span><span class="lbl">SHOT</span></button>'+
        '<button class="action-btn goal" id="btnGoal"><span class="ic">🚨</span><span class="lbl">GOAL</span></button>'+
      '</div>'+
      '<div class="undo-row">'+
        '<button class="btn btn-ghost btn-full btn-sm" id="btnUndo"'+(!s.entries.length?' disabled':'')+'>↶ Undo Last Entry</button>'+
        '<button class="btn btn-outline btn-sm" id="btnFinish">Finish</button>'+
      '</div>'+
      '<div class="section-head"><h2>Recent Entries</h2></div>'+
      '<div class="log-list" id="logList"></div>';

    renderLogList(s);

    el.querySelector('#trkMode').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      s.mode = b.getAttribute('data-v');
      persist();
      renderTrack();
    });
    el.querySelector('#trkPeriod').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      var v = b.getAttribute('data-v');
      s.currentPeriod = (v==='OT') ? 'OT' : Number(v);
      persist();
      renderTrack();
    });
    el.querySelector('#btnEditSessionInfo').addEventListener('click', function(){ openEditSessionModal(s, function(){ renderTrack(); }); });
    el.querySelector('#btnSwitchGoalieLog').addEventListener('click', function(){ openGoalieLogSwitchStep(s); });
    el.querySelector('#btnShot').addEventListener('click', function(){ handleShot(s); });
    el.querySelector('#btnGoal').addEventListener('click', function(){ handleGoal(s); });
    el.querySelector('#btnUndo').addEventListener('click', function(){
      if(!s.entries.length) return;
      var removed = s.entries.pop();
      persist();
      renderTrack();
      showToast('Removed last entry: '+(removed.result==='goal'?'Goal':'Shot'));
    });
    el.querySelector('#btnFinish').addEventListener('click', function(){
      s.finishedAt = Date.now();
      DATA.activeSessionId = null;
      persist();
      openSessionDetail(s.id);
    });
  }

  function renderLogList(s){
    var wrap = document.getElementById('logList');
    if(!wrap) return;
    var recent = s.entries.slice(-8).reverse();
    if(!recent.length){ wrap.innerHTML = '<div class="empty-state" style="padding:20px;">No entries yet — tap Shot or Goal to begin.</div>'; return; }
    var multiGoalie = sessionHasMultipleGoalies(s);
    wrap.innerHTML = recent.map(function(en){
      var bits = [];
      if(en.period) bits.push(en.period==='OT'?'OT':('P'+en.period));
      if(en.clock) bits.push('⏱ '+en.clock);
      if(multiGoalie && en.goalieId){ var eg=DATA.profiles.filter(function(p){return p.id===en.goalieId;})[0]; if(eg) bits.push('G: '+eg.name); }
      if(en.ice) bits.push(iceZoneLabel(en.ice.zone));
      if(en.shotType) bits.push(en.shotType);
      if(en.situation) bits.push(en.situation);
      if(en.net) bits.push(netZoneLabel(en.net.zone, goalieFlipFor(en.goalieId)));
      return (
        '<div class="log-row" data-id="'+en.id+'">'+
          '<div class="lr-left"><span class="lr-chip '+en.result+'"></span>'+
          '<div><div>'+(en.result==='goal'?'Goal':'Shot')+'</div>'+
          (bits.length?('<div class="lr-detail">'+esc(bits.join(' · '))+'</div>'):'')+
          '</div></div>'+
          '<button class="lr-del" data-id="'+en.id+'">✕</button>'+
        '</div>'
      );
    }).join('');
    wrap.querySelectorAll('.lr-del').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var id = btn.getAttribute('data-id');
        confirmAction('Delete this entry?', function(){
          s.entries = s.entries.filter(function(x){return x.id!==id;});
          persist();
          renderTrack();
        });
      });
    });
  }

  /* ---- Goalie Log goalie-switching (2026-09-12, Ben's request) — same idea as
     Team Log's, but picks from DATA.profiles directly (Goalie Log isn't backed
     by a team roster) rather than a roster subset. Reuses the same clock-time
     step and goalieStints log, so computeGoalieMinutes() works identically for
     both log types. */
  function openGoalieLogSwitchStep(s){
    var curId = s.goalieInNetId || s.profileId;
    var opts = DATA.profiles.map(function(p){
      return '<button class="chip roster-tile" data-id="'+p.id+'">'+esc(p.name)+(p.id===curId?' (current)':'')+'</button>';
    }).join('');
    openModal(
      '<div class="modal-title">Who’s in net?</div>'+
      '<div class="chip-wrap">'+opts+'</div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" id="glsCancel">Cancel</button></div>',
      {onMount:function(root){
        root.querySelectorAll('.roster-tile').forEach(function(b){
          b.addEventListener('click', function(){
            var id = b.getAttribute('data-id');
            closeModal();
            openClockTimeStep(s.currentPeriod||1, function(clock){
              s.goalieInNetId = id;
              if(!s.goalieStints) s.goalieStints = [];
              s.goalieStints.push({goalieId:id, period:s.currentPeriod||1, clock:clock, ts:Date.now()});
              persist();
              renderTrack();
            });
          });
        });
        root.querySelector('#glsCancel').addEventListener('click', closeModal);
      }}
    );
  }

  function handleShot(s){
    var gid = s.goalieInNetId || s.profileId;
    if(s.mode==='simple'){
      s.entries.push({id:uid(), result:'shot', ts:Date.now(), period:s.currentPeriod||1, goalieId:gid});
      persist(); renderTrack();
      return;
    }
    openIceStep(function(ice){
      s.entries.push({id:uid(), result:'shot', ts:Date.now(), period:s.currentPeriod||1, goalieId:gid, ice:ice});
      persist(); renderTrack();
    });
  }

  function handleGoal(s){
    var gid = s.goalieInNetId || s.profileId;
    if(s.mode==='simple'){
      s.entries.push({id:uid(), result:'goal', ts:Date.now(), period:s.currentPeriod||1, goalieId:gid});
      persist(); renderTrack();
      return;
    }
    var curGoalieProfile = DATA.profiles.filter(function(p){return p.id===gid;})[0];
    openIceStep(function(ice){
      openNetStep(function(net){
        openDetailStep({}, function(meta){
          openClockTimeStep(s.currentPeriod||1, function(clock){
            s.entries.push({
              id:uid(), result:'goal', ts:Date.now(), period:s.currentPeriod||1, goalieId:gid, clock:clock, ice:ice, net:net,
              shotType:meta.shotType, rebound:meta.rebound, situation:meta.situation
            });
            persist(); renderTrack();
          });
        });
      }, curGoalieProfile?curGoalieProfile.flipSides:undefined);
    });
  }

  /* ---- ice map step: real reference-image zones (assets/reference/shot-zones.png), docs/zones.md ----
     The ice diagram uses the actual reference artwork as the background image, with clickable
     hit-region overlays traced from its colored zones (extracted programmatically from the source
     image's pixel colors, then verified by re-rendering the traced outlines back over the image —

  /* Count-label anchor points (image px coords) — positioned relative to each zone's own
     printed number label in shot-zones.png (measured from the image, not guessed), per Ben's
     2026-09-11 feedback after testing on his phone: zone 1 stays where it was; 3/4 sit directly
     under their zone-label number; 2 sits down-and-right of its zone-label number; 5 sits above
     its zone-label number. */
  var ICE_COUNT_LABEL_POS = {
    highSlot:    [510, 338],
    lowSlot:     [564, 558],
    leftCircle:  [182, 307],
    rightCircle: [850, 306],
    point:       [510, 671]
  };
  function countLabelSvg(x, y, value){
    return '<text x="'+x+'" y="'+y+'" font-size="46" text-anchor="middle" fill="#E4002B" stroke="#ffffff" stroke-width="6" paint-order="stroke" font-family=\'Oswald, sans-serif\' font-weight="800" pointer-events="none">'+value+'</text>';
  }
  /* Session-summary ice-zone label: "goals / shots" (e.g. "2 / 10") — goals in red with a white
     halo, " / " and the shots total in black with a white halo, per Ben's 2026-09-12 request.
     Two <tspan>s share one <text> so text-anchor="middle" centers the combined string as a
     single block instead of centering each number separately. */
  function goalShotLabelSvg(x, y, goals, shots){
    return '<text x="'+x+'" y="'+y+'" font-size="46" text-anchor="middle" font-family=\'Oswald, sans-serif\' font-weight="800" pointer-events="none">'+
      '<tspan fill="#E4002B" stroke="#ffffff" stroke-width="6" paint-order="stroke">'+goals+'</tspan>'+
      '<tspan fill="#12202E" stroke="#ffffff" stroke-width="6" paint-order="stroke"> / '+shots+'</tspan>'+
    '</text>';
  }
  function iceZonesSVG(selectedKey, counts, goalCounts){
    var total = 0;
    if(counts){ ICE_ZONES.forEach(function(z){ total += (counts[z.key]||0); }); }
    var zonesSvg = ICE_ZONES.map(function(zoneDef){
      var key = zoneDef.key;
      var on = key===selectedKey;
      var intensity = counts ? (total ? (counts[key]||0)/total : 0) : 0;
      var opacity = counts ? (0.12 + intensity*0.55) : (on ? 0.5 : 0.22);
      var pts = ICE_ZONE_POINTS[key];
      var shape = '<polygon points="'+pts+'" fill="'+zoneDef.color+'" opacity="'+opacity+'" stroke="'+(on?zoneDef.color:'#ffffff')+'" stroke-width="'+(on?4:2)+'"/>';
      var pos = ICE_COUNT_LABEL_POS[key];
      var countSvg = (counts && counts[key]) ? goalShotLabelSvg(pos[0], pos[1], (goalCounts&&goalCounts[key])||0, counts[key]) : '';
      return '<g class="icezone" data-key="'+key+'" style="cursor:pointer;">'+shape+countSvg+'</g>';
    }).join('');
    return (
      '<svg class="rink" viewBox="0 0 '+ICE_IMG_W+' '+ICE_IMG_H+'" id="iceSvg">'+
        '<image href="'+ICE_IMG+'" x="0" y="0" width="'+ICE_IMG_W+'" height="'+ICE_IMG_H+'" preserveAspectRatio="xMidYMid slice"/>'+
        zonesSvg+
      '</svg>'
    );
  }

  function openIceStep(onDone){
    var selected = null;
    openModal(
      '<div class="modal-title">Where was it taken from?</div>'+
      '<div class="modal-sub">Tap the ice zone the shot came from.</div>'+
      '<div id="iceWrap">'+iceZonesSVG(null)+'</div>'+
      '<div class="tap-hint">Bird\u2019s-eye view \u00b7 one zone, net at top</div>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="iceCancel">Cancel</button>'+
        '<button class="btn btn-red" id="iceNext" disabled>Next</button>'+
      '</div>',
      {onMount:function(root){
        function bind(){
          root.querySelectorAll('.icezone').forEach(function(g){
            g.addEventListener('click', function(){
              selected = g.getAttribute('data-key');
              root.querySelector('#iceWrap').innerHTML = iceZonesSVG(selected);
              bind();
              root.querySelector('#iceNext').disabled = false;
            });
          });
        }
        bind();
        root.querySelector('#iceCancel').addEventListener('click', closeModal);
        root.querySelector('#iceNext').addEventListener('click', function(){
          closeModal();
          onDone({zone:selected});
        });
      }}
    );
  }

        });
        root.querySelector('#clkSkip').addEventListener('click', function(){ closeModal(); onDone(null); });
        root.querySelector('#clkSave').addEventListener('click', function(){
          closeModal();
          if(!mm && !ss){ onDone(null); return; }
          var mmNum = mm?parseInt(mm,10):0, ssNum = ss?parseInt(ss,10):0;
          onDone(mmNum+':'+(ssNum<10?'0':'')+ssNum);

  /* ---- generic (no-photo) ice zones for "For" events — same shapes/keys as the
     real-image map (ICE_ZONE_POINTS, ICE_ZONES), just drawn on a plain schematic
     background instead of shot-zones.png, since this represents the opponent's
     defensive zone (no reference photo exists for that). ---- */
  function iceZonesGenericSVG(selectedKey, counts, goalCounts){
    var total = 0;
    if(counts){ ICE_ZONES.forEach(function(z){ total += (counts[z.key]||0); }); }
    var zonesSvg = ICE_ZONES.map(function(zoneDef){
      var key = zoneDef.key;
      var on = key===selectedKey;
      var intensity = counts ? (total ? (counts[key]||0)/total : 0) : 0;
      var opacity = counts ? (0.18 + intensity*0.6) : (on ? 0.55 : 0.3);
      var pts = ICE_ZONE_POINTS[key];
      var shape = '<polygon points="'+pts+'" fill="'+zoneDef.color+'" opacity="'+opacity+'" stroke="'+(on?zoneDef.color:'#ffffff')+'" stroke-width="'+(on?4:2)+'"/>';
      var coordPairs = pts.split(' ').map(function(pr){ return pr.split(',').map(Number); });
      var xs = coordPairs.map(function(c){return c[0];}), ys = coordPairs.map(function(c){return c[1];});
      var lx = (Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
      var ly = (Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;
      var nameSvg = stackedLabelSvg(zoneDef.lines, lx, ly-14, 24, '#ffffff');
      var pos = ICE_COUNT_LABEL_POS[key];
      var countSvg = (counts && counts[key]) ? goalShotLabelSvg(pos[0], pos[1], (goalCounts&&goalCounts[key])||0, counts[key]) : '';
      return '<g class="icezone" data-key="'+key+'" style="cursor:pointer;">'+shape+nameSvg+countSvg+'</g>';
    }).join('');
    return (
      '<svg class="rink" viewBox="0 0 '+ICE_IMG_W+' '+ICE_IMG_H+'" id="iceSvgGeneric">'+
        '<rect x="0" y="0" width="'+ICE_IMG_W+'" height="'+ICE_IMG_H+'" fill="#DCEBFB"/>'+
        '<rect x="'+(ICE_IMG_W/2-140)+'" y="6" width="280" height="16" rx="4" fill="#8A97A8"/>'+
        '<text x="'+(ICE_IMG_W/2)+'" y="52" font-size="20" text-anchor="middle" fill="#5B6B80" font-family="Archivo, sans-serif" font-weight="700" style="text-transform:uppercase;letter-spacing:.08em;" pointer-events="none">Opponent’s Net</text>'+
        zonesSvg+
      '</svg>'
    );
  }

      '<div id="iceWrapG">'+iceZonesGenericSVG(null)+'</div>'+

  /* ---- generic (no-photo) net zones for Goals For — same 6 zones/geometry as the
     real net map, neutral Left/Right labels instead of Glove/Blocker (the opposing
     goalie's handedness isn't tracked). ---- */
  function netZoneLabelGenericLines(key){
    if(key==='fiveHole') return ['Five-Hole'];
    if(key==='openNet') return ['Open','Net'];
    var top = (key==='leftHigh'||key==='rightHigh');
    var side = (key==='leftHigh'||key==='leftLow') ? 'Left' : 'Right';
    return [side, top?'High':'Low'];
  }
  function netZoneLabelGeneric(key){ return netZoneLabelGenericLines(key).join(' '); }
  function netGoalGenericSVG(selectedKey, counts, goalCounts){
    var total = 0;
    if(counts){ NET_ZONES.forEach(function(z){ total += (counts[z.key]||0); }); }
    var cellsSvg = NET_ZONE_ORDER.map(function(key){
      var zoneDef = NET_ZONES.filter(function(z){ return z.key===key; })[0];
      var on = key===selectedKey;
      var intensity = counts ? (total ? (counts[key]||0)/total : 0) : 0;
      var opacity = counts ? (0.18 + intensity*0.6) : (on ? 0.55 : 0.3);
      var shape, lx, ly;
      if(key==='openNet'){
        shape = '<path d="'+NET_OPEN_NET_D+'" fill-rule="evenodd" fill="'+zoneDef.color+'" opacity="'+opacity+'" stroke="'+(on?zoneDef.color:'#ffffff')+'" stroke-width="'+(on?5:2.5)+'"/>';
        lx = 638; ly = 74;
      } else {
        var pts = NET_ZONE_POINTS[key];
        var xs = pts.map(function(p){return p[0];}), ys = pts.map(function(p){return p[1];});
        lx = (Math.min.apply(null,xs)+Math.max.apply(null,xs))/2;
        ly = (Math.min.apply(null,ys)+Math.max.apply(null,ys))/2;
        var ptsStr = pts.map(function(p){return p[0]+','+p[1];}).join(' ');
        shape = '<polygon points="'+ptsStr+'" fill="'+zoneDef.color+'" opacity="'+opacity+'" stroke="'+(on?zoneDef.color:'#ffffff')+'" stroke-width="'+(on?5:2.5)+'"/>';
      }
      var lines = netZoneLabelGenericLines(key);
      var pos = NET_COUNT_LABEL_POS[key];
      var countSvg = (counts && counts[key])
        ? (goalCounts ? goalShotLabelSvg(pos[0], pos[1], goalCounts[key]||0, counts[key]) : netCountLabelSvg(pos[0], pos[1], counts[key]))
        : '';
      return '<g class="netcell" data-key="'+key+'" style="cursor:pointer;">'+shape+stackedLabelSvg(lines, lx, ly-14, 24, '#0F2038')+countSvg+'</g>';
    }).join('');
    return (
      '<svg class="net" viewBox="0 0 '+NET_IMG_W+' '+NET_IMG_H+'" id="netSvgGeneric">'+
        '<rect x="0" y="0" width="'+NET_IMG_W+'" height="'+NET_IMG_H+'" fill="#EAF1F7"/>'+
        '<rect x="'+NET_FRAME_OUTER.x0+'" y="'+NET_FRAME_OUTER.y0+'" width="'+(NET_FRAME_OUTER.x1-NET_FRAME_OUTER.x0)+'" height="'+(NET_FRAME_OUTER.y1-NET_FRAME_OUTER.y0)+'" fill="none" stroke="#8A97A8" stroke-width="8"/>'+
        cellsSvg+
      '</svg>'
    );
  }

  /* ---- roster picker step (grouped Forwards / Defense / Goalies, sorted by number) ---- */
  function filterByAllowed(arr, allowedIds){
    if(!allowedIds) return arr;
    var allowedSet = {};
    allowedIds.forEach(function(id){ allowedSet[id]=true; });
    return arr.filter(function(p){ return allowedSet[p.id]; });
  }
  function openRosterStep(filter, title, onDone, allowedIds){
    var groups = rosterByPosition();
    groups = {
      F: filterByAllowed(groups.F, allowedIds),
      D: filterByAllowed(groups.D, allowedIds),
      G: filterByAllowed(groups.G, allowedIds)
    };
    var sections;
    if(filter==='goalies-only') sections = [{label:'Goalies', arr:groups.G}];
    else if(filter==='skaters') sections = [{label:'Forwards', arr:groups.F},{label:'Defense', arr:groups.D}];
    else sections = [{label:'Forwards', arr:groups.F},{label:'Defense', arr:groups.D},{label:'Goalies', arr:groups.G}];
    var any = sections.some(function(sec){return sec.arr.length;});
    if(!any){
      openModal(
        '<div class="modal-title">No players available</div>'+
        '<div class="modal-sub">'+(allowedIds?'Nobody eligible is checked in for this game’s roster.':'Add players to your roster from the Team tab first.')+'</div>'+
        '<div class="modal-actions"><button class="btn btn-ghost" id="rsClose">Close</button></div>',
        {center:true, onMount:function(root){ root.querySelector('#rsClose').addEventListener('click', closeModal); }}
      );
      return;
    }
    function tile(p){ return '<button class="chip roster-tile" data-id="'+p.id+'">#'+esc(p.number||'')+' '+esc(p.name)+'</button>'; }
    openModal(
      '<div class="modal-title">'+esc(title)+'</div>'+
      sections.map(function(sec){
        return sec.arr.length ? ('<div class="field"><label>'+sec.label+'</label><div class="chip-wrap">'+sec.arr.map(tile).join('')+'</div></div>') : '';
      }).join('')+
      '<div class="modal-actions"><button class="btn btn-ghost" id="rsCancel">Cancel</button></div>',
      {onMount:function(root){
        root.querySelectorAll('.roster-tile').forEach(function(b){
          b.addEventListener('click', function(){ closeModal(); onDone(b.getAttribute('data-id')); });
        });
        root.querySelector('#rsCancel').addEventListener('click', closeModal);
      }}
    );
  }

  /* ---- assists step (Goals For only, up to 2, optional) ---- */
  function openAssistsStep(scorerId, onDone, allowedIds){
    var groups = rosterByPosition();
    var eligible = filterByAllowed(groups.F.concat(groups.D, groups.G), allowedIds).filter(function(p){ return p.id!==scorerId; });
    var picked = [null, null];
    function tile(p, slot){
      return '<button class="chip" data-slot="'+slot+'" data-id="'+p.id+'">#'+esc(p.number||'')+' '+esc(p.name)+'</button>';

      '<div class="field"><label>Secondary assist</label><div class="chip-wrap" id="asSecondary">'+eligible.map(function(p){return tile(p,1);}).join('')+'</div></div>'+
      '<div class="modal-actions">'+
        '<button class="btn btn-ghost" id="asSkip">No Assists</button>'+
        '<button class="btn btn-red" id="asSave">Save Goal</button>'+

      {onMount:function(root){

          b.addEventListener('click', function(){

            picked[slot] = (picked[slot]===id) ? null : id;
            root.querySelectorAll('.chip[data-slot="'+slot+'"]').forEach(function(c){
              c.classList.toggle('on', c.getAttribute('data-id')===picked[slot]);
            });
          });
        });

  /* ---- event handling ---- */
  function handleTeamEvent(s, kind){
    function finish(entry){
      entry.id = uid();
      entry.ts = Date.now();
      entry.period = s.currentPeriod || 1;
      entry.type = kind;
      s.entries.push(entry);
      persist();
      renderTrackTeam(s);
    }
    if(kind==='hit' || kind==='blockedShot'){
      openRosterStep('skaters', kind==='hit' ? 'Who threw the hit?' : 'Who blocked it?', function(playerId){
        var pl = getRosterPlayer(playerId);
        finish({playerId:playerId, position:pl?pl.position:''});
      }, s.activeRosterIds);
      return;
    }
    if(kind==='shotFor'){
      /* Ice-zone step only — same real reference-image map Shot/Goal Against use
         (Ben's round-4 request), but no net-zone step: a shot that wasn't a goal
         has no "where it went in the net" to record, mirroring Shot Against
         (round 5 correction, 2026-09-12 — round 4 had mistakenly given Shot For
         the net step too). Only Goal For (below) asks for a net zone. */
      openRosterStep('all', 'Who took the shot?', function(playerId){
        var pl = getRosterPlayer(playerId);
        openIceStep(function(ice){
          finish({playerId:playerId, position:pl?pl.position:'', ice:ice});
        });
      }, s.activeRosterIds);
      return;
    }
    if(kind==='goalFor'){
      openRosterStep('all', 'Who scored?', function(playerId){
        var pl = getRosterPlayer(playerId);
        openIceStep(function(ice){
          openNetStep(function(net){
            openAssistsStep(playerId, function(assists){
              openClockTimeStep(s.currentPeriod||1, function(clock){
                finish({playerId:playerId, position:pl?pl.position:'', ice:ice, net:net, assists:assists, clock:clock});
              });
            }, s.activeRosterIds);
          }, false);
        });
      }, s.activeRosterIds);
      return;
    }
    if(kind==='shotAgainst'){
      if(!s.goalieInNetId){ showToast('Set who’s in net first.'); return; }
      openIceStep(function(ice){ finish({goalieId:s.goalieInNetId, ice:ice}); });
      return;
    }
    if(kind==='goalAgainst'){
      if(!s.goalieInNetId){ showToast('Set who’s in net first.'); return; }
      var gp = DATA.profiles.filter(function(p){return p.id===s.goalieInNetId;})[0];
      openIceStep(function(ice){
        openNetStep(function(net){
          openClockTimeStep(s.currentPeriod||1, function(clock){
            finish({goalieId:s.goalieInNetId, ice:ice, net:net, clock:clock});
          });
        }, gp?gp.flipSides:false);
      });
      return;
    }
  }

  function renderTeamLogList(s){

    if(!recent.length){ wrap.innerHTML = '<div class="empty-state" style="padding:20px;">No entries yet — tap a button above to begin.</div>'; return; }
    var gp = DATA.profiles.filter(function(p){return p.id===s.goalieInNetId;})[0];
    wrap.innerHTML = recent.map(function(en){
      var bits = [];
      bits.push(en.period==='OT' ? 'OT' : ('P'+(en.period||1)));

      if(en.playerId){ var p = getRosterPlayer(en.playerId); if(p) bits.push('#'+(p.number||'')+' '+p.name+(en.position?(' ('+en.position+')'):'')); }
      if(en.goalieId){ var g = DATA.profiles.filter(function(x){return x.id===en.goalieId;})[0]; if(g) bits.push('G: '+g.name); }
      if(en.ice) bits.push(iceZoneLabel(en.ice.zone));
      if(en.net) bits.push(en.type==='goalFor' ? netZoneLabel(en.net.zone, false) : netZoneLabel(en.net.zone, gp?gp.flipSides:false));
